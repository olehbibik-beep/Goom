<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>E'O'N - Вход</title>
    <style>
        /* БАЗОВЫЙ СБРОС И ШРИФТЫ */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        /* ТЕ ЖЕ НАСТРОЙКИ ЭКРАНА, ЧТО И В ДЕРЕВНЕ (Решает проблему вылезания за края) */
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overscroll-behavior: none; }
        body { background-color: #000; display: flex; justify-content: center; align-items: center; overflow: hidden; color: #fff; }
        
        #game-frame { position: relative; width: 100%; height: 100%; max-width: 540px; max-height: 960px; background-color: #000; overflow: hidden; }
        @media (min-width: 540px) and (min-height: 960px) { #game-frame { border-radius: 12px; border: 1px solid #333; } }

        /* ФОН (СТАТИЧНЫЙ, БЕЗ АНИМАЦИЙ) */
        .bg-image { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background-image: url('Logo.png'); 
            background-size: cover; background-position: center; 
            z-index: 1; filter: brightness(1); 
        }
        .bg-image.dimmed { filter: brightness(0.2); }

        /* ЭКРАНЫ (МГНОВЕННОЕ ПЕРЕКЛЮЧЕНИЕ) */
        .screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; flex-direction: column; justify-content: center; align-items: center; 
            z-index: 10; 
        }
        .screen.active { display: flex; }

        /* 1. ЗАСТАВКА */
        .loading-container { position: absolute; bottom: 50px; width: 80%; display: flex; flex-direction: column; align-items: center; }
        .loading-text { font-size: 11px; color: #888; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 2px; }
        .loading-bar-bg { width: 100%; height: 4px; background: #333; border-radius: 2px; overflow: hidden; }
        .loading-bar-fill { width: 0%; height: 100%; background: #dcb254; transition: width 0.1s linear; }

        /* ПАНЕЛИ МЕНЮ (КОМПАКТНЫЙ АНТРАЦИТ ДЛЯ МАЛЕНЬКИХ ЭКРАНОВ) */
        .auth-panel { 
            position: relative;
            background-color: #252628; 
            padding: 30px 20px; /* Уменьшил отступы, чтобы влезало на все экраны */
            border-radius: 20px; 
            width: 90%; max-width: 360px; 
            text-align: center; 
            display: flex; flex-direction: column; gap: 12px; 
            max-height: 95%; overflow-y: auto; /* Защита от переполнения */
        }
        .auth-title { font-size: 22px; color: #fff; margin-bottom: 5px; font-weight: 800; letter-spacing: 1px; cursor: pointer; }
        
        /* СТРЕЛКА НАЗАД */
        .back-btn { position: absolute; top: 15px; left: 15px; width: 24px; height: 24px; fill: #888; cursor: pointer; display: flex; justify-content: center; align-items: center; z-index: 10; }
        .back-btn:active { fill: #fff; }

        /* КНОПКИ (СТРОГИЕ) */
        .btn { width: 100%; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; border: none; display: flex; justify-content: center; align-items: center; gap: 10px; outline: none; }
        .btn:active:not(:disabled) { filter: brightness(0.8); }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        
        .btn-guest { background-color: #3a3c40; color: #fff; }
        .btn-google { background-color: #fff; color: #000; }
        .btn-google img { width: 20px; height: 20px; }
        .btn-email { background-color: transparent; color: #dcb254; border: 1px solid #dcb254; }
        .btn-primary { background-color: #dcb254; color: #000; margin-top: 5px; }

        /* ВВОД ДАННЫХ */
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 5px; }
        .auth-input { width: 100%; padding: 14px; background-color: #1c1d1e; border: 1px solid #333; border-radius: 10px; color: #fff; font-size: 15px; outline: none; }
        .auth-input:focus { border-color: #dcb254; }
        .auth-input::placeholder { color: #666; }

        /* СОЗДАНИЕ ПЕРСОНАЖА */
        .gender-toggle { display: flex; justify-content: center; gap: 20px; margin-bottom: 15px; }
        .gender-btn { 
            width: 65px; height: 65px; /* Уменьшено для надежности */
            border-radius: 16px; 
            background-color: #1c1d1e; 
            border: 2px solid #333; 
            display: flex; justify-content: center; align-items: center; 
            cursor: pointer; color: #666;
        }
        .gender-btn svg { width: 32px; height: 32px; fill: currentColor; }
        .gender-btn.selected { background-color: #1dc5b4; border-color: #1dc5b4; color: #fff; }

        .sub-avatars-container { display: none; gap: 8px; justify-content: center; margin-bottom: 20px; min-height: 65px; }
        .sub-avatars-container.active { display: flex; }
        
        .sub-avatar { 
            width: 65px; height: 65px; /* Уменьшено для надежности */
            background-color: #1c1d1e; 
            border: 2px solid #333; 
            border-radius: 12px; 
            cursor: pointer; 
            display: flex; justify-content: center; align-items: center; 
            overflow: hidden; 
        }
        .sub-avatar img { width: 100%; height: 100%; object-fit: cover; image-rendering: high-quality; }
        .sub-avatar.selected { border-color: #1dc5b4; }

        #btn-start-game { display: none; }
        #btn-start-game.visible { display: flex; }

        /* DEV ПАНЕЛЬ */
        .btn-dev { background-color: #1c1d1e; color: #00ffcc; border: 1px solid #00ffcc; }
        .btn-danger { background-color: #1c1d1e; color: #ff0055; border: 1px solid #ff0055; margin-top: 10px; }

    </style>
</head>
<body>

<div id="game-frame">
    <!-- ФОН -->
    <div class="bg-image" id="main-bg"></div>

    <!-- ЭКРАН 1: ЗАСТАВКА И ЗАГРУЗКА -->
    <div class="screen active" id="screen-splash">
        <div class="loading-container">
            <div class="loading-text" id="loading-msg">Синхронизация...</div>
            <div class="loading-bar-bg">
                <div class="loading-bar-fill" id="loading-fill"></div>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 2: ВЫБОР АВТОРИЗАЦИИ -->
    <div class="screen" id="screen-auth">
        <div class="auth-panel">
            <h1 class="auth-title" onclick="secretDevTap()">E'O'N</h1>
            <button class="btn btn-guest" onclick="loginGuest()">Играть как Гость</button>
            <button class="btn btn-google" onclick="loginGoogle()">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="G">
                Продолжить с Google
            </button>
            <button class="btn btn-email" onclick="switchScreen('screen-email')">Создать аккаунт / Почта</button>
        </div>
    </div>

    <!-- ЭКРАН 3: EMAIL / ПАРОЛЬ -->
    <div class="screen" id="screen-email">
        <div class="auth-panel">
            <div class="back-btn" onclick="switchScreen('screen-auth')">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </div>
            
            <h1 class="auth-title">АККАУНТ</h1>
            <div class="input-group">
                <input type="email" id="email-input" class="auth-input" placeholder="Почта">
                <input type="password" id="password-input" class="auth-input" placeholder="Пароль">
            </div>
            <button class="btn btn-primary" onclick="loginEmail()">Войти</button>
        </div>
    </div>

    <!-- ЭКРАН 4: СОЗДАНИЕ ПЕРСОНАЖА -->
    <div class="screen" id="screen-create">
        <div class="auth-panel">
            <div class="back-btn" onclick="logoutFromCreate()">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </div>

            <!-- Значки Марса и Венеры -->
            <div class="gender-toggle">
                <div class="gender-btn selected" id="gender-boy" onclick="selectGender('boy')">
                    <svg viewBox="0 0 24 24"><path d="M15 3v2h4.59l-4.71 4.71C13.67 8.64 12.38 8 11 8c-3.86 0-7 3.14-7 7s3.14 7 7 7 7-3.14 7-7c0-1.38-.64-2.67-1.71-3.88L21 6.41V11h2V3h-8zm-4 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
                </div>
                <div class="gender-btn" id="gender-girl" onclick="selectGender('girl')">
                    <svg viewBox="0 0 24 24"><path d="M12 3c-3.86 0-7 3.14-7 7 0 3.39 2.42 6.22 5.61 6.86V19H8v2h2.61v2h2.78v-2H16v-2h-2.61v-2.14C16.58 16.22 19 13.39 19 10c0-3.86-3.14-7-7-7zm0 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
                </div>
            </div>

            <div class="sub-avatars-container" id="avatar-row"></div>
            
            <button class="btn btn-primary" id="btn-start-game" onclick="finishCreation()">Начать приключение</button>
        </div>
    </div>

    <!-- ЭКРАН 5: ПАНЕЛЬ РАЗРАБОТЧИКА -->
    <div class="screen" id="screen-dev">
        <div class="auth-panel">
            <h1 class="auth-title" style="color: #00ffcc;">DEV ПАНЕЛЬ</h1>
            
            <button class="btn btn-dev" onclick="launchTest('index.html')">Остров (index)</button>
            <button class="btn btn-dev" onclick="launchTest('garden.html')">Огород (garden)</button>
            <button class="btn btn-dev" onclick="launchTest('gate.html')">Врата (gate)</button>
            
            <button class="btn btn-danger" onclick="resetSave()">Удалить сохранение</button>
            <button class="btn btn-guest" onclick="logoutDev()" style="margin-top: 5px;">Выйти</button>
        </div>
    </div>

</div>

<!-- ПОДКЛЮЧЕНИЕ FIREBASE -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
    import { getAuth, signInAnonymously, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDFCGFnL3pNfrHiwqCZkXapdhC5bKmg_SE",
        authDomain: "time-gate-game.firebaseapp.com",
        projectId: "time-gate-game",
        storageBucket: "time-gate-game.firebasestorage.app",
        messagingSenderId: "789791906588",
        appId: "1:789791906588:web:5bf53149ff3b14de9178d9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let finalAvatarFile = null;
    let currentUserUid = null;
    let currentUserEmail = null;

    // --- УПРАВЛЕНИЕ ЭКРАНАМИ (МГНОВЕННОЕ) ---
    window.switchScreen = function(screenId) {
        document.querySelectorAll('.screen').forEach(s => {
            if (s.id === screenId) {
                s.classList.add('active');
            } else {
                s.classList.remove('active');
            }
        });

        const bg = document.getElementById('main-bg');
        if (screenId === 'screen-splash') {
            bg.classList.remove('dimmed');
        } else {
            bg.classList.add('dimmed'); 
        }
    };

    // --- 1. ЛОГИКА ЗАСТАВКИ ---
    let progress = 0;
    const fill = document.getElementById('loading-fill');
    
    const loadingInterval = setInterval(() => {
        progress += Math.random() * 15; 
        if(progress > 100) progress = 100;
        fill.style.width = progress + '%';
        
        if (progress >= 100) {
            clearInterval(loadingInterval);
            checkAuthStatus();
        }
    }, 100);

    // --- 2. ПРОВЕРКА АВТОРИЗАЦИИ ---
    function checkAuthStatus() {
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserUid = user.uid;
                currentUserEmail = user.email;
                localStorage.setItem('userUid', user.uid);
                
                if (currentUserEmail === 'dev@goom.studio') {
                    window.switchScreen('screen-dev');
                    return;
                }

                const docSnap = await getDoc(doc(db, "users", user.uid));
                if (docSnap.exists()) {
                    window.location.replace('index.html'); 
                } else {
                    window.switchScreen('screen-create'); 
                    window.selectGender('boy');
                }
            } else {
                window.switchScreen('screen-auth');
            }
        });
    }

    // --- 3. ФУНКЦИИ ВХОДА ---
    window.loginGuest = function() {
        signInAnonymously(auth).catch(error => alert("Ошибка: " + error.message));
    };

    window.loginGoogle = function() {
        const provider = new GoogleAuthProvider();
        signInWithPopup(auth, provider).catch(error => alert("Ошибка: " + error.message));
    };

    window.loginEmail = async function() {
        const email = document.getElementById('email-input').value.trim();
        const pwd = document.getElementById('password-input').value;
        if (!email || !pwd) return;

        try {
            await signInWithEmailAndPassword(auth, email, pwd);
        } catch (error) {
            if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                try {
                    await createUserWithEmailAndPassword(auth, email, pwd);
                } catch (regError) {
                    alert("Ошибка: " + regError.message);
                }
            } else {
                alert("Ошибка: " + error.message);
            }
        }
    };

    window.logoutFromCreate = function() {
        signOut(auth).then(() => {
            localStorage.removeItem('userUid');
            window.switchScreen('screen-auth');
        });
    };

    // --- СЕКРЕТНАЯ ПАСХАЛКА ---
    let devTapCount = 0;
    let devTapTimer = null;
    window.secretDevTap = function() {
        devTapCount++;
        clearTimeout(devTapTimer);
        if (devTapCount >= 5) {
            window.switchScreen('screen-dev');
            devTapCount = 0;
        } else {
            devTapTimer = setTimeout(() => { devTapCount = 0; }, 400);
        }
    };

    // --- 4. СОЗДАНИЕ ПЕРСОНАЖА (МГНОВЕННОЕ) ---
    window.selectGender = function(gender) {
        document.getElementById('gender-boy').classList.toggle('selected', gender === 'boy');
        document.getElementById('gender-girl').classList.toggle('selected', gender === 'girl');

        const row = document.getElementById('avatar-row');
        row.className = 'sub-avatars-container active';
        row.innerHTML = ''; 
        
        for(let i = 1; i <= 4; i++) {
            let fileName = `${gender}${i}.png`; 
            let div = document.createElement('div');
            div.className = 'sub-avatar';
            div.onclick = () => window.selectFinalAvatar(fileName, div);
            div.innerHTML = `<img src="${fileName}" onerror="this.style.display='none'">`;
            row.appendChild(div);
        }
        
        finalAvatarFile = null;
        document.getElementById('btn-start-game').classList.remove('visible');
        
        // Автовыбор первой картинки
        setTimeout(() => {
            const firstAvatar = row.querySelector('.sub-avatar');
            if(firstAvatar) window.selectFinalAvatar(`${gender}1.png`, firstAvatar);
        }, 10);
    };

    window.selectFinalAvatar = function(fileName, element) {
        finalAvatarFile = fileName;
        document.querySelectorAll('.sub-avatar').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');
        document.getElementById('btn-start-game').classList.add('visible');
    };

    window.finishCreation = async function() {
        if (!finalAvatarFile || !currentUserUid) return;
        
        const btn = document.getElementById('btn-start-game');
        btn.innerText = "Создание...";
        btn.disabled = true;

        const startData = {
            avatar: finalAvatarFile, 
            sandCount: 150, 
            epochLevel: 1, 
            currentXP: 0, 
            targetXP: 50, 
            loginStreak: 0, 
            lastClaimDate: null, 
            gardenWaterUsed: 0, 
            lastHarvestTime: null
        };

        try {
            await setDoc(doc(db, "users", currentUserUid), startData);
            window.location.replace('index.html');
        } catch (error) {
            alert("Ошибка создания!");
            btn.innerText = "Начать приключение";
            btn.disabled = false;
        }
    };

    // --- 5. ФУНКЦИИ DEV ПАНЕЛИ ---
    window.launchTest = function(url) {
        window.location.replace(url);
    };

    window.resetSave = async function() {
        if (!currentUserUid) return;
        if(confirm("Удалить сохранение?")) {
            try {
                await deleteDoc(doc(db, "users", currentUserUid));
                window.switchScreen('screen-create');
                window.selectGender('boy'); 
            } catch (e) {
                alert("Ошибка: " + e.message);
            }
        }
    };

    window.logoutDev = function() {
        signOut(auth).then(() => {
            localStorage.removeItem('userUid');
            window.switchScreen('screen-auth');
        });
    };
</script>
</body>
</html>
