<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>E'O'N - Вход</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { background-color: #050505; display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; overflow: hidden; color: #fff; }
        #game-frame { position: relative; width: 100%; height: 100%; max-width: 540px; max-height: 960px; background-color: #000; overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.9); }
        @media (min-width: 540px) and (min-height: 960px) { #game-frame { border-radius: 12px; border: 1px solid #333; } }

        /* ОСНОВНОЙ ФОН ИЗ ЛОГОТИПА */
        .bg-image { 
            position: absolute; top: -5%; left: -5%; width: 110%; height: 110%; 
            background-image: url('Logo.png'); 
            background-size: cover; background-position: center; 
            transition: filter 1s ease, transform 3s ease; 
            z-index: 1; 
            filter: blur(0px) brightness(1); 
        }
        .bg-image.blurred { 
            filter: blur(12px) brightness(0.4); 
            transform: scale(1.05); 
        }

        /* ЭКРАНЫ */
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; transition: opacity 0.4s, transform 0.4s; opacity: 0; visibility: hidden; pointer-events: none; }
        .screen.active { opacity: 1; visibility: visible; pointer-events: auto; transform: scale(1); }
        .screen.hidden-up { transform: translateY(-50px); opacity: 0; }
        .screen.hidden-down { transform: translateY(50px); opacity: 0; }

        /* 1. ЗАСТАВКА */
        .loading-container { position: absolute; bottom: 60px; width: 80%; display: flex; flex-direction: column; align-items: center; }
        .loading-text { font-size: 11px; color: rgba(255,255,255,0.7); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 2px; }
        .loading-bar-bg { width: 100%; height: 4px; background: rgba(0,0,0,0.6); border-radius: 2px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        .loading-bar-fill { width: 0%; height: 100%; background: #dcb254; transition: width 0.2s ease; box-shadow: 0 0 10px #dcb254; }

        /* ПАНЕЛИ МЕНЮ */
        .auth-panel { 
            position: relative;
            background: rgba(30, 35, 40, 0.6); 
            padding: 40px 30px; 
            border-radius: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px); 
            width: 85%; max-width: 380px; /* Чуть расширено для 4-х крупных аватарок */
            text-align: center; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.02); 
            display: flex; flex-direction: column; gap: 15px; 
        }
        .auth-title { font-size: 26px; color: #fff; margin-bottom: 5px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 4px 15px rgba(0,0,0,0.8); cursor: pointer; }
        
        /* СТРЕЛКА НАЗАД */
        .back-btn { position: absolute; top: 25px; left: 25px; width: 24px; height: 24px; fill: rgba(255,255,255,0.6); cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; z-index: 10; }
        .back-btn:active { transform: scale(0.9); fill: #fff; }

        /* КНОПКИ */
        .btn { width: 100%; padding: 15px; border-radius: 14px; font-size: 15px; font-weight: bold; cursor: pointer; border: none; transition: transform 0.1s, filter 0.2s, background 0.2s, opacity 0.2s; display: flex; justify-content: center; align-items: center; gap: 10px; outline: none; }
        .btn:active:not(:disabled) { transform: scale(0.95); filter: brightness(0.9); }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        
        .btn-guest { background: rgba(0, 0, 0, 0.6); color: #eef4f7; border: 1px solid rgba(255,255,255,0.1); }
        .btn-guest:hover { background: rgba(0, 0, 0, 0.8); border-color: rgba(255,255,255,0.3); }
        .btn-google { background: #fff; color: #333; border: 1px solid #ddd; }
        .btn-google img { width: 20px; height: 20px; }
        .btn-email { background: transparent; color: #dcb254; border: 1px solid rgba(220, 178, 84, 0.5); }
        .btn-email:hover { background: rgba(220, 178, 84, 0.1); border-color: #dcb254; }
        .btn-primary { background: linear-gradient(135deg, #dcb254, #b8860b); color: #000; text-shadow: 0 1px 2px rgba(255,255,255,0.2); margin-top: 10px; }

        /* ВВОД ДАННЫХ (EMAIL) */
        .input-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 10px; }
        .auth-input { width: 100%; padding: 14px 15px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; font-size: 15px; outline: none; transition: border-color 0.3s, background 0.3s; }
        .auth-input:focus { border-color: #dcb254; background: rgba(0,0,0,0.6); }
        .auth-input::placeholder { color: rgba(255,255,255,0.4); }

        /* ========================================= */
        /* НОВЫЙ ДИЗАЙН: СОЗДАНИЕ ПЕРСОНАЖА */
        /* ========================================= */
        
        /* Значки пола (Символы Марса и Венеры) */
        .gender-toggle { display: flex; justify-content: center; gap: 30px; margin-bottom: 20px; margin-top: 5px; }
        .gender-btn { 
            width: 60px; height: 60px; 
            border-radius: 16px; 
            background: rgba(0, 0, 0, 0.3); 
            border: 2px solid transparent; 
            display: flex; justify-content: center; align-items: center; 
            cursor: pointer; transition: all 0.2s ease;
            color: rgba(255,255,255,0.3);
        }
        .gender-btn svg { width: 34px; height: 34px; fill: currentColor; transition: 0.2s; }
        
        /* Выбранный пол (Бирюзовый квадрат + белый значок) */
        .gender-btn.selected { 
            background: #1dc5b4; 
            color: #ffffff; 
            box-shadow: 0 5px 20px rgba(29, 197, 180, 0.4);
            transform: translateY(-3px);
        }

        /* Слоты аватарок (4 в ряд) */
        .sub-avatars-container { display: flex; gap: 12px; justify-content: center; margin-bottom: 25px; min-height: 75px; }
        .sub-avatar { 
            width: 70px; height: 70px; /* Увеличили размер */
            background: rgba(15, 20, 25, 0.8); 
            border: 2px solid transparent; 
            border-radius: 14px; 
            cursor: pointer; transition: all 0.2s ease; 
            display: flex; justify-content: center; align-items: center; 
            overflow: hidden; 
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8); 
        }
        
        /* Качество картинки: object-fit + rendering, без фильтров тени */
        .sub-avatar img { 
            width: 100%; height: 100%; 
            object-fit: cover; 
            transition: transform 0.2s; 
            image-rendering: high-quality;
        }
        
        /* Выбранная аватарка */
        .sub-avatar.selected { 
            border-color: #1dc5b4; /* Тот же бирюзовый цвет для гармонии */
            box-shadow: 0 0 15px rgba(29, 197, 180, 0.5); 
            transform: translateY(-3px);
        }
        .sub-avatar.selected img { transform: scale(1.08); }

        #btn-start-game { display: none; margin-top: 5px; }
        #btn-start-game.visible { display: flex; animation: popIn 0.3s ease; }

        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* DEV ПАНЕЛЬ */
        .btn-dev { background: rgba(0, 255, 204, 0.1); color: #00ffcc; border: 1px solid rgba(0, 255, 204, 0.5); }
        .btn-danger { background: rgba(255, 0, 85, 0.1); color: #ff0055; border: 1px solid rgba(255, 0, 85, 0.5); margin-top: 15px; }

    </style>
</head>
<body>

<div id="game-frame">
    <!-- ФОН (Логотип) -->
    <div class="bg-image" id="main-bg"></div>

    <!-- ЭКРАН 1: ЗАСТАВКА И ЗАГРУЗКА -->
    <div class="screen active" id="screen-splash">
        <div class="loading-container">
            <div class="loading-text" id="loading-msg">Синхронизация эпох...</div>
            <div class="loading-bar-bg">
                <div class="loading-bar-fill" id="loading-fill"></div>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 2: ВЫБОР АВТОРИЗАЦИИ -->
    <div class="screen" id="screen-auth">
        <div class="auth-panel">
            <h1 class="auth-title" onclick="secretDevTap()">E'O'N</h1>
            
            <button class="btn btn-guest" onclick="loginGuest()">Играть как Гость</button>
            <button class="btn btn-google" onclick="loginGoogle()">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="G">
                Продолжить с Google
            </button>
            <button class="btn btn-email" onclick="switchScreen('screen-email')">Создать аккаунт / Почта</button>
        </div>
    </div>

    <!-- ЭКРАН 3: EMAIL / ПАРОЛЬ -->
    <div class="screen" id="screen-email">
        <div class="auth-panel">
            <!-- Стрелка Назад -->
            <div class="back-btn" onclick="switchScreen('screen-auth')">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </div>
            
            <h1 class="auth-title" style="font-size: 24px;">АККАУНТ</h1>
            
            <div class="input-group">
                <input type="email" id="email-input" class="auth-input" placeholder="Ваша почта">
                <input type="password" id="password-input" class="auth-input" placeholder="Пароль (от 6 символов)">
            </div>
            
            <button class="btn btn-primary" onclick="loginEmail()">Войти / Зарегистрироваться</button>
        </div>
    </div>

    <!-- ЭКРАН 4: СОЗДАНИЕ ПЕРСОНАЖА -->
    <div class="screen" id="screen-create">
        <div class="auth-panel" style="padding-top: 35px;">
            <!-- Стрелка Назад -->
            <div class="back-btn" onclick="logoutFromCreate()">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </div>
            
            <!-- Выбор Пола (Значки Марса и Венеры) -->
            <div class="gender-toggle">
                <!-- Мальчик -->
                <div class="gender-btn selected" id="gender-boy" onclick="selectGender('boy')">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 3v2h4.59l-4.71 4.71C13.67 8.64 12.38 8 11 8c-3.86 0-7 3.14-7 7s3.14 7 7 7 7-3.14 7-7c0-1.38-.64-2.67-1.71-3.88L21 6.41V11h2V3h-8zm-4 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
                </div>
                <!-- Девочка -->
                <div class="gender-btn" id="gender-girl" onclick="selectGender('girl')">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-3.86 0-7 3.14-7 7 0 3.39 2.42 6.22 5.61 6.86V19H8v2h2.61v2h2.78v-2H16v-2h-2.61v-2.14C16.58 16.22 19 13.39 19 10c0-3.86-3.14-7-7-7zm0 12c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
                </div>
            </div>

            <!-- Динамический ряд из 4 крупных аватарок -->
            <div class="sub-avatars-container" id="avatar-row">
                <!-- Заполняется через JS (boy1.png - boy4.png) -->
            </div>
            
            <button class="btn btn-primary" id="btn-start-game" onclick="finishCreation()" disabled>Начать приключение</button>
        </div>
    </div>

    <!-- ЭКРАН 5: ПАНЕЛЬ РАЗРАБОТЧИКА -->
    <div class="screen" id="screen-dev">
        <div class="auth-panel" style="border-color: rgba(0, 255, 204, 0.4); box-shadow: 0 0 30px rgba(0, 255, 204, 0.15);">
            <h1 class="auth-title" style="color: #00ffcc; font-size: 22px; letter-spacing: 1px;">🛠 DEV ПАНЕЛЬ</h1>
            
            <button class="btn btn-dev" onclick="launchTest('index.html')">🏝 Основной Остров (index)</button>
            <button class="btn btn-dev" onclick="launchTest('garden.html')">🌱 Огород (garden)</button>
            <button class="btn btn-dev" onclick="launchTest('gate.html')">🌀 Врата Времени (gate)</button>
            
            <button class="btn btn-danger" onclick="resetSave()">Удалить сохранение</button>
            <button class="btn btn-secondary" onclick="logoutDev()" style="margin-top: 5px;">Выйти из аккаунта</button>
        </div>
    </div>

</div>

<!-- ПОДКЛЮЧЕНИЕ FIREBASE -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
    import { getAuth, signInAnonymously, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDFCGFnL3pNfrHiwqCZkXapdhC5bKmg_SE",
        authDomain: "time-gate-game.firebaseapp.com",
        projectId: "time-gate-game",
        storageBucket: "time-gate-game.firebasestorage.app",
        messagingSenderId: "789791906588",
        appId: "1:789791906588:web:5bf53149ff3b14de9178d9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentGender = null;
    let finalAvatarFile = null;
    let currentUserUid = null;
    let currentUserEmail = null;

    // --- УПРАВЛЕНИЕ ЭКРАНАМИ И ФОНОМ ---
    window.switchScreen = function(screenId) {
        document.querySelectorAll('.screen').forEach(s => {
            if (s.id === screenId) {
                s.classList.remove('hidden-up', 'hidden-down');
                s.classList.add('active');
            } else {
                s.classList.remove('active');
                if (s.id === 'screen-splash') s.classList.add('hidden-up'); 
                else s.classList.add('hidden-down');
            }
        });

        const bg = document.getElementById('main-bg');
        if (screenId === 'screen-splash') {
            bg.classList.remove('blurred');
        } else {
            bg.classList.add('blurred'); 
        }
    };

    // --- 1. ЛОГИКА ЗАСТАВКИ ---
    let progress = 0;
    const fill = document.getElementById('loading-fill');
    const msg = document.getElementById('loading-msg');
    
    const loadingInterval = setInterval(() => {
        progress += Math.random() * 8; 
        if(progress > 100) progress = 100;
        fill.style.width = progress + '%';
        
        if(progress > 30) msg.innerText = "Подготовка острова...";
        if(progress > 70) msg.innerText = "Проверка данных...";
        
        if (progress >= 100) {
            clearInterval(loadingInterval);
            checkAuthStatus();
        }
    }, 200);

    // --- 2. ПРОВЕРКА АВТОРИЗАЦИИ ---
    function checkAuthStatus() {
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserUid = user.uid;
                currentUserEmail = user.email;
                localStorage.setItem('userUid', user.uid);
                
                if (currentUserEmail === 'dev@goom.studio') {
                    window.switchScreen('screen-dev');
                    return;
                }

                const docSnap = await getDoc(doc(db, "users", user.uid));
                if (docSnap.exists()) {
                    window.location.replace('index.html'); 
                } else {
                    // Активируем экран создания и сразу выбираем Мальчика
                    window.switchScreen('screen-create'); 
                    window.selectGender('boy');
                }
            } else {
                window.switchScreen('screen-auth');
            }
        });
    }

    // --- 3. ФУНКЦИИ ВХОДА ---
    window.loginGuest = function() {
        signInAnonymously(auth).catch(error => alert("Ошибка Гостя: " + error.message));
    };

    window.loginGoogle = function() {
        const provider = new GoogleAuthProvider();
        signInWithPopup(auth, provider).catch(error => alert("Ошибка Google: " + error.message));
    };

    window.loginEmail = async function() {
        const email = document.getElementById('email-input').value.trim();
        const pwd = document.getElementById('password-input').value;
        if (!email || !pwd) { alert("Заполните почту и пароль!"); return; }

        try {
            await signInWithEmailAndPassword(auth, email, pwd);
        } catch (error) {
            if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                try {
                    await createUserWithEmailAndPassword(auth, email, pwd);
                } catch (regError) {
                    alert("Ошибка регистрации: " + regError.message);
                }
            } else {
                alert("Ошибка входа: " + error.message);
            }
        }
    };

    window.logoutFromCreate = function() {
        signOut(auth).then(() => {
            localStorage.removeItem('userUid');
            window.switchScreen('screen-auth');
        });
    };

    // --- СЕКРЕТНАЯ ПАСХАЛКА (5 тапов) ---
    let devTapCount = 0;
    let devTapTimer = null;
    window.secretDevTap = function() {
        devTapCount++;
        clearTimeout(devTapTimer);
        if (devTapCount >= 5) {
            window.switchScreen('screen-dev');
            devTapCount = 0;
        } else {
            devTapTimer = setTimeout(() => { devTapCount = 0; }, 400);
        }
    };

    // --- 4. СОЗДАНИЕ ПЕРСОНАЖА (НОВЫЙ ЧИСТЫЙ ДИЗАЙН) ---
    window.selectGender = function(gender) {
        currentGender = gender;
        
        // Подсвечиваем бирюзовым нужную кнопку
        document.getElementById('gender-boy').classList.toggle('selected', gender === 'boy');
        document.getElementById('gender-girl').classList.toggle('selected', gender === 'girl');

        const row = document.getElementById('avatar-row');
        row.innerHTML = ''; 
        for(let i = 1; i <= 4; i++) {
            let fileName = `${gender}${i}.png`; // Генерируем boy1.png и т.д.
            let div = document.createElement('div');
            div.className = 'sub-avatar';
            div.onclick = () => window.selectFinalAvatar(fileName, div);
            
            // Если картинки нет, фон будет просто темно-серым квадратом
            div.innerHTML = `<img src="${fileName}" onerror="this.style.opacity='0'">`;
            row.appendChild(div);
        }
        
        // Автоматически выбираем первую картинку из 4
        setTimeout(() => {
            const firstAvatar = row.querySelector('.sub-avatar');
            if(firstAvatar) {
                window.selectFinalAvatar(`${gender}1.png`, firstAvatar);
            }
        }, 50);
    };

    window.selectFinalAvatar = function(fileName, element) {
        finalAvatarFile = fileName;
        
        document.querySelectorAll('.sub-avatar').forEach(el => el.classList.remove('selected'));
        element.classList.add('selected');
        
        document.getElementById('btn-start-game').disabled = false;
    };

    window.finishCreation = async function() {
        if (!finalAvatarFile || !currentUserUid) return;
        
        const btn = document.getElementById('btn-start-game');
        btn.innerText = "Создание...";
        btn.disabled = true;

        const startData = {
            avatar: finalAvatarFile, // Сохраняем 'boy1.png' и т.д.
            sandCount: 150, 
            epochLevel: 1, 
            currentXP: 0, 
            targetXP: 50, 
            loginStreak: 0, 
            lastClaimDate: null, 
            gardenWaterUsed: 0, 
            lastHarvestTime: null
        };

        try {
            await setDoc(doc(db, "users", currentUserUid), startData);
            window.location.replace('index.html');
        } catch (error) {
            console.error(error);
            alert("Ошибка создания!");
            btn.innerText = "Начать приключение";
            btn.disabled = false;
        }
    };

    // --- 5. ФУНКЦИИ DEV ПАНЕЛИ ---
    window.launchTest = function(url) {
        window.location.replace(url);
    };

    window.resetSave = async function() {
        if (!currentUserUid) return;
        if(confirm("Вы уверены? Весь прогресс (песчинки, уровень) будет удален!")) {
            try {
                await deleteDoc(doc(db, "users", currentUserUid));
                alert("Сохранение удалено. Вы можете создать персонажа заново.");
                window.switchScreen('screen-create');
                window.selectGender('boy'); 
            } catch (e) {
                alert("Ошибка удаления: " + e.message);
            }
        }
    };

    window.logoutDev = function() {
        signOut(auth).then(() => {
            localStorage.removeItem('userUid');
            window.switchScreen('screen-auth');
        });
    };
</script>
</body>
</html>
