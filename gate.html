<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Врата Времени</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overscroll-behavior: none; }
        body { background-color: #050505; display: flex; justify-content: center; align-items: center; overflow: hidden; color: #fff; }

        #game-frame { position: relative; width: 100%; height: 100%; max-width: 540px; max-height: 960px; background-color: #181c1d; overflow: hidden; }
        @media (min-width: 540px) and (min-height: 960px) { #game-frame { border-radius: 12px; border: 1px solid #333; box-shadow: 0 0 30px rgba(0,0,0,0.9); } }

        .full-screen-bg { position: absolute; top: -5%; left: -5%; width: 110%; height: 110%; background-image: radial-gradient(circle at 50% 50%, transparent 40%, rgba(10, 12, 14, 0.8) 100%), url('casy_2.jpg'); background-size: cover; background-position: center; z-index: 0; pointer-events: none; }

        /* --- ВЕРХНИЙ БЛОК --- */
        .top-status-container { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px; display: flex; align-items: center; z-index: 30; pointer-events: none; }
        
        .level-badge { position: relative; width: 60px; height: 60px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; z-index: 3; cursor: pointer; pointer-events: auto; }
        .level-badge:active { transform: scale(0.95); }
        .level-gear-icon { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 1;}
        .level-text { position: relative; z-index: 2; color: #ffffff; font-weight: 900; font-size: 26px; transform: translateY(-2px); line-height: 1; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0px 2px 4px rgba(0,0,0,0.8); }

        .top-progress-bar { flex-grow: 1; height: 18px; background: repeating-linear-gradient(-45deg, #222222, #222222 10px, #1a1c1d 10px, #1a1c1d 20px); border: 1px solid #4a433a; border-radius: 6px; position: relative; margin-left: -15px; padding-left: 15px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.9); overflow: hidden; z-index: 1; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
        .xp-text { position: relative; z-index: 5; font-size: 13px; font-weight: bold; color: #ffffff; text-shadow: 1px 1px 3px rgba(0,0,0,0.9); letter-spacing: 0.5px; white-space: nowrap; pointer-events: none; transform: translateY(-1px); line-height: 1;}
        .progress-fill { position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: repeating-linear-gradient(-45deg, #dcb254, #dcb254 10px, #ffdf00 10px, #ffdf00 20px); background-size: 28px 28px; border-radius: 4px; transition: width 0.5s ease-out; box-shadow: 0 0 10px rgba(255, 223, 0, 0.5); }

        .level-up-badge { position: relative; width: 34px; height: 34px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; margin-left: -12px; z-index: 3; pointer-events: auto; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6)); }
        .level-up-gear { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 1; }
        .level-up-arrow { position: relative; z-index: 2; color: #181c1d; font-weight: 900; font-size: 18px; transform: translateY(-2px); line-height: 1; }

        /* --- БОКОВОЕ МЕНЮ СПРАВА --- */
        .right-side-menu { position: absolute; top: 85px; right: 15px; display: flex; flex-direction: column; gap: 15px; z-index: 30; }
        .side-img-btn { width: 45px; height: auto; cursor: pointer; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8)); transition: transform 0.2s; }
        .side-img-btn:active { transform: scale(0.95); }

        /* --- КОРПУС ЧАСОВ --- */
        .clock-wrapper { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 400px; aspect-ratio: 1 / 1; }
        .heat-ring { position: absolute; border-radius: 50%; opacity: 0; pointer-events: none; z-index: 5; transition: opacity 0.1s; }
        .ring-inner { top: 28%; left: 28%; right: 28%; bottom: 28%; box-shadow: inset 0 0 30px 10px rgba(255,255,255,0.9), 0 0 30px 10px rgba(255,255,255,0.7); }
        .ring-middle { top: 15%; left: 15%; right: 15%; bottom: 15%; box-shadow: inset 0 0 35px 10px rgba(0,150,255,0.9), 0 0 30px 10px rgba(0,150,255,0.6); }
        .ring-outer { top: 2%; left: 2%; right: 2%; bottom: 2%; box-shadow: inset 0 0 40px 12px rgba(255,60,60,0.9), 0 0 35px 10px rgba(32,178,170,0.8); }

        .sparks-layer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 14; pointer-events: none; }
        .spark { position: absolute; width: 2px; height: 10px; border-radius: 2px; background: var(--c1); box-shadow: 0 0 6px var(--c1), 0 0 10px var(--c2); pointer-events: none; will-change: transform, opacity; animation: spark-fly cubic-bezier(0.1, 1, 0.3, 1) forwards; }
        @keyframes spark-fly { 0% { transform: translate(-50%, -50%) rotate(var(--rot)) scaleY(1); opacity: 1; } 100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) rotate(var(--rot)) scaleY(0.2); opacity: 0; } }
        .idle-spark { position: absolute; width: 4px; height: 4px; background: #fcebbb; border-radius: 50%; box-shadow: 0 0 10px #dcb254, 0 0 5px #fff; pointer-events: none; opacity: 0; animation: idle-float 2.5s ease-in-out forwards; }
        @keyframes idle-float { 0% { transform: scale(0.5) translate(0, 0); opacity: 0; } 50% { opacity: 0.8; } 100% { transform: scale(1.5) translate(var(--dx), var(--dy)); opacity: 0; } }
        
        .sand-particle { position: absolute; width: 6px; height: 6px; background: #fcebbb; border-radius: 50%; box-shadow: 0 0 10px #dcb254, 0 0 5px #fff; pointer-events: none; z-index: 50; }
        .xp-particle { position: absolute; width: 6px; height: 6px; background: #20b2aa; border-radius: 50%; box-shadow: 0 0 10px #20b2aa, 0 0 5px #fff; pointer-events: none; z-index: 150; }

        .hand { position: absolute; bottom: 50%; left: 50%; border: none; filter: drop-shadow(4px 4px 8px rgba(0,0,0,0.8)); transform-origin: bottom center; transform: translateX(-50%) rotate(0deg); display: flex; justify-content: center; }
        .hand::after { content: ''; position: absolute; bottom: 0; background: #fcebbb; box-shadow: 0 0 6px #dcb254, 0 0 12px #ffdf00; z-index: 2; border-radius: 2px; }
        .hand-thick { width: 18px; height: 22%; background: #9ca196; z-index: 13; clip-path: polygon(50% 0%, 100% 20%, 100% 100%, 0% 100%, 0% 20%); transition: transform 9s cubic-bezier(0.6, 0, 0.1, 1) 0s; }
        .hand-thick::after { width: 2px; height: 65%; }
        .hand-medium { width: 22px; height: 38%; background: #9ca196; z-index: 12; transition: transform 11s cubic-bezier(0.6, 0, 0.1, 1) 0.8s; }
        .hand-medium::before { content: ''; position: absolute; top: 10%; bottom: 10%; left: -4px; right: -4px; background: repeating-linear-gradient(to bottom, transparent 0px, transparent 6px, #9ca196 6px, #9ca196 10px); z-index: -1; }
        .hand-medium::after { width: 2px; height: 75%; }
        .hand-thin { width: 6px; height: 44%; background: #8b7968; z-index: 11; transition: transform 15s cubic-bezier(0.5, 0, 0.1, 1) 1.8s; }
        .hand-thin::after { width: 4px; height: 98%; }

        .center-gear-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85px; height: 85px; background: transparent; border: none; outline: none; cursor: pointer; z-index: 20; transition: transform 0.2s ease; animation: gear-pulse 2s infinite alternate; }
        @keyframes gear-pulse { 0% { filter: drop-shadow(0 0 10px rgba(220, 178, 84, 0.4)); } 100% { filter: drop-shadow(0 0 25px rgba(252, 235, 187, 0.8)); } }
        .gear-bg-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; transition: filter 0.3s ease; z-index: 1; }
        .cost-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2; display: flex; align-items: center; justify-content: center; gap: 4px; pointer-events: none; width: 100%; }
        .cost-text { color: #ffffff; font-size: 24px; font-weight: bold; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0px 0px 5px rgba(0,0,0,0.8); line-height: 1;}
        .mini-hourglass { width: 20px; height: 20px; object-fit: contain; filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.8)); }
        
        .center-gear-btn:hover:not(:disabled) .gear-bg-img { filter: brightness(1.2); }
        .center-gear-btn:active:not(:disabled) { transform: translate(-50%, -50%) scale(0.95); }
        .center-gear-btn:disabled { animation: none; filter: none; }
        .center-gear-btn:disabled .gear-bg-img { filter: grayscale(50%) brightness(0.6); }
        .center-gear-btn:disabled .cost-text { color: #aaaaaa; text-shadow: none; }
        .center-gear-btn:disabled .mini-hourglass { filter: grayscale(100%); }

        /* --- НИЖНЕЕ МЕНЮ --- */
        .bottom-menu { position: absolute; bottom: 0; left: 0; width: 100%; padding: 10px 20px 25px 20px; display: flex; justify-content: space-between; align-items: flex-end; z-index: 30; pointer-events: none; }
        .menu-side-group { flex: 1; display: flex; justify-content: space-around; padding-bottom: 5px; align-items: center; pointer-events: auto; }
        
        .menu-icon-img { width: 45px; height: auto; cursor: pointer; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8)); transition: transform 0.2s; }
        .menu-icon-img:active { transform: scale(0.95); }

        .center-sand-wrapper { position: relative; pointer-events: auto; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; transition: transform 0.2s; }
        .center-sand-wrapper:active { transform: scale(0.95); }
        .player-avatar { width: 60px; height: auto; display: block; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8)); margin-bottom: 5px; }

        .boy-sand-counter { background: #252628; border: 1px solid #dcb254; border-radius: 8px; padding: 4px 12px; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.9); z-index: 15; white-space: nowrap; }
        .boy-sand-counter img { width: 16px; height: 16px; object-fit: contain; }
        .boy-sand-counter span { color: #fcebbb; font-size: 15px; font-weight: bold; }

        /* --- ВСПЛЫВАЮЩИЕ ОКНА (OVERLAY) --- */
        .event-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 13, 16, 0.7); backdrop-filter: blur(10px); z-index: 100; display: flex; justify-content: center; align-items: center; visibility: hidden; opacity: 0; transition: opacity 0.3s ease, visibility 0.3s ease; }
        .event-overlay.show { opacity: 1; pointer-events: auto; visibility: visible; cursor: pointer; }
        .event-overlay.flying { background: transparent !important; backdrop-filter: none !important; }

        .event-modal { background: transparent; border: none; padding: 10px; width: 90%; max-width: 500px; text-align: center; transform: scale(0.8); transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.2, 1); position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .event-overlay.show .event-modal { transform: scale(1); }
        .text-panel { width: 100%; display: flex; flex-direction: column; align-items: center; transition: opacity 0.3s; pointer-events: none; }
        .event-img { width: 100%; max-height: 40vh; object-fit: contain; border: none; margin-bottom: 10px; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.9)); z-index: 1; position: relative;}
        .event-title { font-size: 26px; margin-bottom: 5px; transition: color 0.3s, text-shadow 0.3s; }
        .event-desc { color: #fcebbb; font-size: 17px; line-height: 1.4; margin-bottom: 10px; text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 0 10px #000; }
        
        /* --- ЛИНИЯ ВРЕМЕНИ --- */
        .timeline-container { position: relative; width: 90%; height: 50px; margin: 5px auto 15px auto; }
        .timeline-line { position: absolute; top: 20px; left: 0; width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; }
        .timeline-marker { position: absolute; top: 15px; width: 2px; height: 14px; background: rgba(255,255,255,0.5); }
        .timeline-marker span { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #8ba2c2; white-space: nowrap; }
        .marker-start { left: 0%; } .marker-zero { left: 66.5%; } .marker-end { left: 100%; }
        .marker-current { position: absolute; top: 8px; width: 3px; height: 28px; background: #20b2aa; box-shadow: 0 0 10px #20b2aa; z-index: 5; transition: left 1s cubic-bezier(0.2, 0.9, 0.2, 1); }

        /* --- СТИЛЬ ЗАСТАВКИ (ДЛЯ МИНИ-ИГР) --- */
        .event-modal.splash-mode { width: 100%; max-width: 600px; padding: 0; display: block; }
        .event-modal.splash-mode .event-img { width: 100%; height: auto; max-height: 80vh; object-fit: contain; margin: 0; filter: drop-shadow(0 15px 30px rgba(0,0,0,0.8)); }
        .event-modal.splash-mode .text-panel { position: absolute; bottom: 10%; left: 5%; width: 90%; display: flex; flex-direction: row; justify-content: space-around; align-items: center; background: transparent; padding: 0; z-index: 2; }
        .event-modal.splash-mode .event-title { color: #ffffff !important; font-size: 24px; font-weight: bold; text-shadow: 1px 1px 3px rgba(0,0,0,0.9) !important; margin: 0; width: 35%; text-align: center; }
        .event-modal.splash-mode .event-desc { color: #ffffff; font-size: 16px; font-weight: bold; text-shadow: 1px 1px 3px rgba(0,0,0,0.9); margin: 0; width: 55%; text-align: center; line-height: 1.2; }
        .event-modal.splash-mode .timeline-container { display: none; }

        /* ИНФО-ОКНО */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 300; display: none; justify-content: center; align-items: center; }
        .modal-overlay.show { display: flex; }
        .info-modal { background: #252628; border: none; width: 80%; max-width: 320px; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; text-align: center; }
        .info-modal-header { background: #1c1d1e; color: #dcb254; padding: 15px; font-weight: 800; font-size: 16px; letter-spacing: 1px; text-transform: uppercase; }
        .info-modal-body { color: #fff; padding: 25px 15px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; }
        .info-modal-footer { background: #1dc5b4; color: #000; padding: 15px; cursor: pointer; font-weight: bold; font-size: 15px; }
        .info-modal-footer:active { filter: brightness(0.8); }

        #loading-screen { position: absolute; top:0; left:0; width:100%; height:100%; background:#000; z-index:99999; display:flex; justify-content:center; align-items:center; color:#888; font-weight:bold; font-size:14px; text-transform: uppercase; letter-spacing: 2px; }
        
        /* ПЕРЕХОД ОБЛАКОВ (1 СЛОЙ) */
        .clouds-transition { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; pointer-events: none; display: flex; justify-content: space-between; opacity: 1; transition: opacity 0.5s ease; overflow: hidden; }
        .clouds-transition.open { opacity: 0; visibility: hidden; transition: opacity 0.5s ease 0.8s, visibility 0s 1.3s; }
        .cloud-left, .cloud-right { position: relative; width: 60%; height: 100%; background: #2c3e50; transition: transform 1s cubic-bezier(0.65, 0, 0.35, 1); }
        .cloud-left::before, .cloud-left::after, .cloud-right::before, .cloud-right::after { content: ''; position: absolute; border-radius: 50%; background: inherit; }
        .cloud-left::before { width: 90%; aspect-ratio: 1; right: -25%; top: 15%; } .cloud-left::after { width: 110%; aspect-ratio: 1; right: -35%; top: 50%; }
        .cloud-right::before { width: 80%; aspect-ratio: 1; left: -25%; top: 5%; } .cloud-right::after { width: 100%; aspect-ratio: 1; left: -45%; top: 35%; }
        .clouds-transition.open .cloud-left { transform: translateX(-150%); } .clouds-transition.open .cloud-right { transform: translateX(150%); }
    </style>
</head>
<body>

  <div id="game-frame">

    <div id="loading-screen">ЗАГРУЗКА...</div>

    <div class="clouds-transition" id="clouds">
        <div class="cloud-left"></div>
        <div class="cloud-right"></div>
    </div>

    <div class="full-screen-bg"></div>

    <div class="top-status-container">
        <div class="level-badge" onclick="showInfoModal('УРОВЕНЬ ЭПОХИ', 'Копите опыт (XP) для повышения уровня!')">
            <img src="gear.png" class="level-gear-icon" alt="" onerror="this.style.display='none'">
            <span class="level-text" id="level-text">1</span>
        </div>
        <div class="top-progress-bar" id="progress-bar-container">
            <div class="progress-fill" id="progress-fill"></div>
            <span class="xp-text" id="xp-text">0 / 50</span>
        </div>
        <div class="level-up-badge">
            <img src="gear.png" class="level-up-gear" alt="" onerror="this.style.display='none'">
            <span class="level-up-arrow">↑</span>
        </div>
    </div>

    <div class="right-side-menu">
        <img src="castle.png" class="side-img-btn" onclick="showInfoModal('ЗАЛ СЛАВЫ', 'В разработке!')" alt="Топ Игроков" onerror="this.style.display='none'">
        <img src="mail.png" class="side-img-btn" onclick="showInfoModal('ПОЧТА', 'В разработке!')" alt="Сообщения" onerror="this.style.display='none'">
    </div>

    <div class="clock-wrapper" id="wrapper">
        <div class="heat-ring ring-outer" id="ring-outer"></div>
        <div class="heat-ring ring-middle" id="ring-middle"></div>
        <div class="heat-ring ring-inner" id="ring-inner"></div>
        
        <div class="hand hand-thin" id="hand1"></div>
        <div class="hand hand-medium" id="hand2"></div>
        <div class="hand hand-thick" id="hand3"></div>
        <div class="sparks-layer" id="sparks-layer"></div>

        <button class="center-gear-btn" id="spinButton" onclick="payAndSpin()">
            <img src="buttom.png" class="gear-bg-img" alt="Запуск" onerror="this.style.display='none'">
            <div class="cost-overlay">
                <span class="cost-text">15</span>
                <img src="ty.png" class="mini-hourglass" alt="" onerror="this.style.display='none'">
            </div>
        </button>
    </div>

    <div class="bottom-menu">
        <div class="menu-side-group" style="justify-content: flex-start; padding-left: 10px;">
            <!-- Левая часть пустая, чтобы сбалансировать Назад справа -->
        </div>
        
        <div class="center-sand-wrapper" id="boy-wrapper" onclick="addTestSand()">
            <img id="player-avatar" src="boy1.png" class="player-avatar" alt="Персонаж" onerror="this.style.display='none'">
            <div class="boy-sand-counter" id="sand-counter-ui">
                <img src="ty.png" style="width:16px; height:16px; object-fit:contain;" alt="">
                <span id="sand-display">150</span>
            </div>
        </div>

        <div class="menu-side-group" style="justify-content: flex-end; padding-right: 10px;">
            <!-- Кнопка Назад (возврат на Остров) -->
            <img src="back.png" class="menu-icon-img" alt="Назад" onclick="goToLocation('index.html')" onerror="this.style.display='none'">
        </div>
    </div>

    <!-- ОКНО СОБЫТИЯ С ОЖИДАНИЕМ КЛИКА -->
    <div class="event-overlay" id="event-overlay" onclick="handleOverlayClick()">
        <div class="event-modal" id="event-modal">
            <img src="" id="event-img" class="event-img" alt="Событие" onerror="this.style.display='none'">
            <div class="text-panel" id="text-panel">
                <h2 class="event-title" id="event-title">Год</h2>
                
                <div class="timeline-container" id="timeline-container">
                    <div class="timeline-line"></div>
                    <div class="timeline-marker marker-start"><span>4026 до н.э.</span></div>
                    <div class="timeline-marker marker-zero"><span>0</span></div>
                    <div class="timeline-marker marker-end"><span>2026 н.э.</span></div>
                    <div class="marker-current" id="timeline-current"></div>
                </div>

                <p class="event-desc" id="event-desc">Описание события...</p>
            </div>
        </div>
    </div>

    <!-- УНИВЕРСАЛЬНОЕ ИНФО-ОКНО -->
    <div class="modal-overlay" id="info-modal-overlay" onclick="closeInfoModal(event)">
        <div class="info-modal" onclick="event.stopPropagation()">
            <div class="info-modal-header" id="info-modal-title">Внимание</div>
            <div class="info-modal-body" id="info-modal-text">Текст сообщения</div>
            <div class="info-modal-footer" onclick="closeInfoModal()">ОК</div>
        </div>
    </div>

  </div>

    <!-- ПОДКЛЮЧЕНИЕ БАЗЫ ДАННЫХ И ЛОГИКА -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const userUid = localStorage.getItem('userUid');
        if (!userUid) { window.location.replace('login.html'); }

        const firebaseConfig = {
            apiKey: "AIzaSyDFCGFnL3pNfrHiwqCZkXapdhC5bKmg_SE",
            authDomain: "time-gate-game.firebaseapp.com",
            projectId: "time-gate-game",
            storageBucket: "time-gate-game.firebasestorage.app",
            messagingSenderId: "789791906588",
            appId: "1:789791906588:web:5bf53149ff3b14de9178d9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const userDocRef = doc(db, "users", userUid);

        window.gameData = { sandCount: 150, epochLevel: 1, currentXP: 0, targetXP: 50, pendingPoints: 0, pendingEventObj: null, avatar: 'boy1.png' };

        const SPIN_COST = 15; 
        let isMinigamePending = false;
        let pendingUrl = '';
        let isClickable = false;

        let currentRotation1 = 0; let currentRotation2 = 0; let currentRotation3 = 0;
        let prevRot1 = 0; let prevRot2 = 0; let prevRot3 = 0;

                xpTextDisplay.innerText = `${Math.floor(window.gameData.currentXP)} / ${window.gameData.targetXP}`;

        function checkXP() {
            if (window.gameData.currentXP >= window.gameData.targetXP) {
                progressFill.style.transition = 'width 0.3s ease-out'; progressFill.style.width = `100%`;
                xpTextDisplay.innerText = `${window.gameData.targetXP} / ${window.gameData.targetXP}`;
                setTimeout(processLevelUp, 350); 
            } else {
                progressFill.style.transition = 'width 0.5s ease-out';
                progressFill.style.width = `${(window.gameData.currentXP / window.gameData.targetXP) * 100}%`;
                xpTextDisplay.innerText = `${Math.floor(window.gameData.currentXP)} / ${window.gameData.targetXP}`;
                saveDataToCloud();
            }
        }
        
        function addXP(amount) {

        function flyXPToBar(amount) {
            const target = document.getElementById('progress-bar-container');
            const startRect = btn.getBoundingClientRect();
            const endRect = target.getBoundingClientRect();
            const frameRect = gameFrame.getBoundingClientRect();
            
            const startX = startRect.left - frameRect.left + startRect.width / 2;
            const startY = startRect.top - frameRect.top + startRect.height / 2;
            const endX = endRect.left - frameRect.left + 20; 
            const endY = endRect.top - frameRect.top + endRect.height / 2;
            
            const particleCount = Math.min(10 + Math.floor(amount / 5), 25);
            
            for (let i = 0; i < particleCount; i++) {
                setTimeout(() => {
                    let particle = document.createElement('div');
                    particle.className = 'xp-particle';
                    particle.style.left = startX + 'px';
                    particle.style.top = startY + 'px';
                    gameFrame.appendChild(particle);

                    let scatterX = (Math.random() - 0.5) * 100;
                    let scatterY = (Math.random() - 0.5) * 100;

                    particle.animate([
                        { transform: 'translate(0, 0) scale(1)' },
                        { transform: `translate(${scatterX}px, ${scatterY}px) scale(1.5)`, offset: 0.4 }, 
                        { transform: `translate(${endX - startX}px, ${endY - startY}px) scale(0.2)` }
                    ], { duration: 900 + Math.random() * 300, easing: 'ease-in-out', fill: 'forwards' });
                    
                    setTimeout(() => particle.remove(), 1200);
                }, i * 40); 
            }
            
            setTimeout(() => {
                addXP(amount);
            }, 800);
        }

        function applyRarityStyle(element, rarity) {
            if (rarity === 'common') {
                element.style.color = '#aaaaaa';
                element.style.textShadow = '0 2px 4px #000';
            } else if (rarity === 'rare') {
                element.style.color = '#20b2aa';
                element.style.textShadow = '0 0 10px #20b2aa, 0 2px 4px #000';
            } else if (rarity === 'epic') {
                element.style.color = '#ffdf00';
                element.style.textShadow = '0 0 15px #ffdf00, 0 2px 4px #000';
            } else if (rarity === 'legendary') {
                element.style.color = '#ff4500';
                element.style.textShadow = '0 0 20px #ff4500, 0 2px 4px #000';
            }
        }

        function showEventModal(year, description, rarity) {
            let isConstruction = description.toLowerCase().includes("строительств");
            let isEnthronement = description.toLowerCase().includes("воцарени") || description.toLowerCase().includes("цар");
            let isMinigame = (rarity === 'rare' || rarity === 'epic') && (isConstruction || isEnthronement);

            let displayYearStr = year < 0 ? Math.abs(year) + " год до н.э." : year + " год н.э.";
            if (rarity === 'legendary') displayYearStr = "Эпоха Хранителя";

            let finalImgSrc = isMinigame ? 'stro_2.png' : `${Math.abs(year)}.png`;
            if (rarity === 'legendary') finalImgSrc = 'secret.png';
            
            eventImg.style.display = 'block'; 
            eventImg.src = finalImgSrc; 
            eventTitle.innerText = displayYearStr; 
            applyRarityStyle(eventTitle, rarity);

            if (rarity === 'common') {
                eventDesc.style.display = 'none';
            } else {
                eventDesc.style.display = 'block';
                eventDesc.innerText = description;
            }
            
            let minYear = -4026;
            let maxYear = 2026;
            let displayYearPos = year;
            if (rarity === 'legendary') displayYearPos = 2026;
            let percent = ((displayYearPos - minYear) / (maxYear - minYear)) * 100;
            
            document.getElementById('timeline-current').style.left = percent + '%';

            window.gameData.pendingEventObj = {
                title: displayYearStr,
                img: finalImgSrc,
                rarity: rarity,
                desc: description,
                timelinePercent: percent
            };

            isMinigamePending = isMinigame;
            
            if (isMinigame) {
                pendingUrl = isConstruction ? 'tower.html' : 'crown.html';
                eventModal.classList.add('splash-mode');
            } else {
                eventModal.classList.remove('splash-mode');
                document.getElementById('timeline-container').style.display = 'block';
            }
            
            isClickable = false;
            eventOverlay.classList.add('show');
            saveDataToCloud();
            
            setTimeout(() => { isClickable = true; }, 500);
        }

        function getRotation(el) {
            const st = window.getComputedStyle(el); const tr = st.getPropertyValue("transform");
            if (tr === "none") return 0;
            let values = tr.split('(')[1].split(')')[0].split(',');
            return Math.atan2(parseFloat(values[1]), parseFloat(values[0])) * (180 / Math.PI);
        }

        window.payAndSpin = function() {
            if (isSpinning) return;
            if (window.gameData.sandCount < SPIN_COST) { window.showInfoModal("ВНИМАНИЕ", "Недостаточно песчинок времени!"); return; }
            window.gameData.sandCount -= SPIN_COST; sandDisplay.innerText = window.gameData.sandCount; saveDataToCloud();
            isSpinning = true; btn.disabled = true; 
            
            const boy = document.getElementById('boy-wrapper'); const target = btn;
            const startRect = boy.getBoundingClientRect(); const endRect = target.getBoundingClientRect();
            const frameRect = gameFrame.getBoundingClientRect();

            let startX = startRect.left - frameRect.left + startRect.width/2;
            let startY = startRect.top - frameRect.top + startRect.height/2;
            let endX = endRect.left - frameRect.left + endRect.width/2;
            let endY = endRect.top - frameRect.top + endRect.height/2;

            for (let i = 0; i < 12; i++) {
                setTimeout(() => {
                    let particle = document.createElement('div'); particle.className = 'sand-particle';
                    particle.style.left = (startX + (Math.random() - 0.5)*30) + 'px';
                    particle.style.top = (startY + (Math.random() - 0.5)*30) + 'px';
                    gameFrame.appendChild(particle);

                    particle.animate([
                        { transform: 'translate(0, 0) scale(1)' },
                        { transform: `translate(${(endX - parseFloat(particle.style.left))/2}px, -120px) scale(1.5)` }, 
                        { transform: `translate(${endX - parseFloat(particle.style.left)}px, ${endY - parseFloat(particle.style.top)}px) scale(0.2)` }
                    ], { duration: 700, easing: 'ease-in-out', fill: 'forwards' });
                    setTimeout(() => particle.remove(), 700);
                }, i * 40); 
            }
            setTimeout(spinClock, 800);
        }

        function spawnSparksForHand(hand, prevAngle, radius, centerX, centerY, colorMain, colorGlow) {
            let currentAngle = getRotation(hand); let speed = currentAngle - prevAngle;
            if (speed < -180) speed += 360; if (speed > 180) speed -= 360; speed = Math.abs(speed); 
            if (speed < 1.5) return currentAngle; 

            let count = Math.floor(speed / 3); 
            let rad = currentAngle * Math.PI / 180;
            let tipX = centerX + radius * Math.sin(rad); let tipY = centerY - radius * Math.cos(rad);

            for (let i = 0; i < count; i++) {
                let spark = document.createElement('div'); spark.className = 'spark';
                let tangRad = (currentAngle + 90 + (Math.random() - 0.5) * 50) * Math.PI / 180; 
                let dist = 10 + Math.random() * (speed * 8); 
                spark.style.setProperty('--c1', colorMain); spark.style.setProperty('--c2', colorGlow);
                spark.style.left = tipX + 'px'; spark.style.top = tipY + 'px';
                spark.style.setProperty('--tx', (dist * Math.sin(tangRad)) + 'px');
                spark.style.setProperty('--ty', (-dist * Math.cos(tangRad)) + 'px');
                spark.style.setProperty('--rot', (currentAngle + 90) + 'deg');
                spark.style.animationDuration = (0.3 + Math.random() * 0.4) + 's';
                sparksLayer.appendChild(spark); setTimeout(() => spark.remove(), 800); 
            }
            return currentAngle;
        }

        function renderPhysics() {
            let elapsed = Date.now() - startTime; if (elapsed > 16000) return; 

            let progress = elapsed / 4000; if (progress > 1) progress = 1;
            let fadeOut = elapsed > 9000 ? (16800 - elapsed) / 7800 : 1; if (fadeOut < 0) fadeOut = 0;
            let baseOpacity = progress * fadeOut * 0.8;

            ringInner.style.opacity = baseOpacity;
            ringMiddle.style.opacity = currentActiveRings >= 2 ? baseOpacity : 0;
            ringOuter.style.opacity  = currentActiveRings >= 3 ? baseOpacity : 0;

            const rect = wrapper.getBoundingClientRect(); const R = rect.height / 2;
            const centerX = rect.width / 2; const centerY = rect.height / 2;

            prevRot1 = spawnSparksForHand(hand1, prevRot1, R * 0.88, centerX, centerY, '#ffaa00', '#ff4500');
            prevRot2 = spawnSparksForHand(hand2, prevRot2, R * 0.64, centerX, centerY, '#ff8c00', '#ff0000');
            prevRot3 = spawnSparksForHand(hand3, prevRot3, R * 0.44, centerX, centerY, '#ffb732', '#ff4500');
            animationFrameId = requestAnimationFrame(renderPhysics);
        }

        function spinClock() {
            let roll = Math.random();
            let randomYear, description, rarity;

            if (roll < 0.70) {
                randomYear = Math.floor(Math.random() * 6052) - 4026; 
                if (randomYear === 0) randomYear = 1;
                description = "";
                rarity = 'common';
                window.gameData.pendingPoints = 10;
                currentActiveRings = 1;
            } else if (roll < 0.90) {
                let keys = Object.keys(eventsDatabase);
                randomYear = parseInt(keys[Math.floor(Math.random() * keys.length)]);
                description = eventsDatabase[randomYear];
                rarity = 'rare';
                window.gameData.pendingPoints = 30;
                currentActiveRings = 2;
            } else if (roll < 0.99) {
                let keys = Object.keys(specialEventsDatabase);
                randomYear = parseInt(keys[Math.floor(Math.random() * keys.length)]);
                description = specialEventsDatabase[randomYear];
                rarity = 'epic';
                window.gameData.pendingPoints = 100;
                window.gameData.sandCount += 30;
                sandDisplay.innerText = window.gameData.sandCount;
                currentActiveRings = 3;
            } else {
                randomYear = 7777; 
                description = "Тайное послание Хранителя Времени найдено!";
                rarity = 'legendary';
                window.gameData.pendingPoints = 500;
                window.gameData.sandCount += 100;
                sandDisplay.innerText = window.gameData.sandCount;
                currentActiveRings = 3;
            }

            saveDataToCloud(); 

            currentRotation3 += (360 * 6) + Math.floor(Math.random() * 360); 
            currentRotation2 += (360 * 10) + Math.floor(Math.random() * 360); 
            currentRotation1 += (360 * 16) + Math.floor(Math.random() * 360); 

            prevRot1 = getRotation(hand1); prevRot2 = getRotation(hand2); prevRot3 = getRotation(hand3);
            hand3.style.transform = `translateX(-50%) rotate(${currentRotation3}deg)`;
            hand2.style.transform = `translateX(-50%) rotate(${currentRotation2}deg)`;
            hand1.style.transform = `translateX(-50%) rotate(${currentRotation1}deg)`;

            startTime = Date.now(); cancelAnimationFrame(animationFrameId); requestAnimationFrame(renderPhysics);

            setTimeout(() => {
                isSpinning = false; btn.disabled = false;
                showEventModal(randomYear, description, rarity);
            }, 16800); 
        }

        function startIdleAnimation() {
            setInterval(() => {
                if (isSpinning) return; 
                const rect = wrapper.getBoundingClientRect();
                const centerX = rect.width / 2; const centerY = rect.height / 2;
                let spark = document.createElement('div'); spark.className = 'idle-spark';
                let angle = Math.random() * Math.PI * 2; let radius = 40 + Math.random() * 80; 
                spark.style.left = centerX + Math.cos(angle) * radius + 'px';
                spark.style.top = centerY + Math.sin(angle) * radius + 'px';
                spark.style.setProperty('--dx', (Math.random() - 0.5) * 40 + 'px');
                spark.style.setProperty('--dy', (Math.random() - 0.5) * 40 - 20 + 'px');
                sparksLayer.appendChild(spark);
                setTimeout(() => spark.remove(), 2500);
            }, 350); 
        }
        startIdleAnimation();
    </script>
</body>
