<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Лагерь Времени</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overscroll-behavior: none; }
        body { background-color: #5b8e88; display: flex; justify-content: center; align-items: center; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }
        #game-frame { position: relative; width: 100%; height: 100%; max-width: 540px; max-height: 960px; background-color: #5b8e88; overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.9); }
        @media (min-width: 540px) and (min-height: 960px) { #game-frame { border-radius: 12px; border: 1px solid #333; } }

        /* ВЕРХНИЙ БЛОК */
        .top-status-container { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px; display: flex; align-items: center; z-index: 30; pointer-events: none; transition: opacity 0.3s; }
        .level-badge { position: relative; width: 60px; height: 60px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; z-index: 3; transition: transform 0.3s; cursor: pointer; pointer-events: auto; }
        .level-badge:active { transform: scale(0.95); }
        .level-gear-icon { position: absolute; top: 0; left: 0; width: 100%; height: 100%; fill: #ffd700; z-index: 1;}
        .level-text { position: relative; z-index: 2; color: #ffffff; font-weight: 900; font-size: 26px; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0px 2px 4px rgba(0,0,0,0.8); transform: translateY(-2px); line-height: 1; }
        .top-progress-bar { flex-grow: 1; height: 18px; background: repeating-linear-gradient(-45deg, #222222, #222222 10px, #1a1c1d 10px, #1a1c1d 20px); border: 1px solid #4a433a; border-radius: 6px; position: relative; margin-left: -15px; padding-left: 15px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.9); overflow: hidden; z-index: 1; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
        .xp-text { position: relative; z-index: 5; font-size: 13px; font-weight: bold; color: #ffffff; text-shadow: 1px 1px 3px rgba(0,0,0,0.9); letter-spacing: 0.5px; white-space: nowrap; pointer-events: none; transform: translateY(-1px); line-height: 1;}
        .progress-fill { position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: repeating-linear-gradient(-45deg, #dcb254, #dcb254 10px, #ffdf00 10px, #ffdf00 20px); background-size: 28px 28px; border-radius: 4px; transition: width 0.5s ease-out; box-shadow: 0 0 10px rgba(255, 223, 0, 0.5); }
        .level-up-badge { position: relative; width: 34px; height: 34px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; margin-left: -12px; z-index: 3; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6)); pointer-events: auto; }
        .level-up-gear { position: absolute; top: 0; left: 0; width: 100%; height: 100%; fill: #a68b5b; z-index: 1; }
        .level-up-arrow { position: relative; z-index: 2; color: #181c1d; font-weight: 900; font-size: 18px; transform: translateY(-2px); line-height: 1; }

        /* НИЖНЕЕ МЕНЮ */
        .bottom-menu { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(to top, rgba(5,5,5,0.9) 0%, transparent 100%); padding: 10px 20px 25px 20px; display: flex; justify-content: space-between; align-items: flex-end; z-index: 30; pointer-events: none; }
        .menu-side-group { flex: 1; display: flex; align-items: flex-end; gap: 12px; pointer-events: auto; }
        .center-sand-wrapper { position: relative; pointer-events: auto; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; transition: transform 0.2s; pointer-events: auto; }
        .center-sand-wrapper:active { transform: scale(0.95); }
        .boy-avatar { width: 60px; height: auto; display: block; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8)); margin-bottom: 5px; }
        .boy-sand-counter { background: rgba(10, 13, 16, 0.95); border: 1px solid #dcb254; border-radius: 12px; padding: 4px 12px; display: flex; align-items: center; gap: 5px; box-shadow: 0 4px 10px rgba(0,0,0,0.9); white-space: nowrap; }
        .boy-sand-counter svg { width: 14px; height: 14px; fill: #dcb254; } 
        .boy-sand-counter span { color: #fcebbb; font-size: 15px; font-weight: bold; }
        .square-btn { position: relative; width: 46px; height: 46px; background-color: #293133; border: 2px solid #ffffff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.8); cursor: pointer; transition: transform 0.1s, border-color 0.2s; display: flex; justify-content: center; align-items: flex-end; pointer-events: auto; }
        .square-btn:active { transform: scale(0.92); border-color: #dcb254; }
        .square-btn img { position: absolute; bottom: 0; left: 0; width: 100%; height: 140%; object-fit: contain; object-position: bottom center; pointer-events: none; filter: drop-shadow(0 -2px 5px rgba(0,0,0,0.5)); }

        /* ИНТЕРАКТИВНАЯ КАРТА */
        .map-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; overflow: hidden; touch-action: none; }
        .map-container { position: absolute; width: 2560px; height: 1440px; top: 50%; left: 50%; margin-top: -720px; margin-left: -1280px; background-image: url('Viledges.png'); background-size: cover; background-position: center; transform-origin: center center; will-change: transform; }

        /* ИНТЕРАКТИВНЫЕ ЭЛЕМЕНТЫ (Ваши идеальные координаты) */
        .map-pin { position: absolute; transform: translate(-50%, -50%); cursor: pointer; z-index: 15; border-radius: 20px; }
        .map-pin:active { transform: translate(-50%, -50%) scale(0.95); }
        
        #pin-hall { top: 55.5%; left: 46.2%; width: 150px; height: 180px; }  
        #pin-lib { top: 54.8%; left: 59.7%; width: 150px; height: 150px; }       
        #pin-mpso { top: 60.7%; left: 66.8%; width: 150px; height: 140px; }      
        #pin-gate { top: 52.4%; left: 38.0%; width: 100px; height: 100px; }    
        #pin-tent { top: 64.5%; left: 51.1%; width: 120px; height: 100px; }    
        #pin-garden { top: 47.4%; left: 50.8%; width: 120px; height: 120px; }  

        .notification-dot { position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; background: #ff4500; border: 3px solid #0a0c0f; border-radius: 50%; display: none; box-shadow: 0 0 15px #ff4500; }
        .notification-dot.active { display: block; }

        /* ОГОРОД И ВЫРАЩЕННЫЙ КУСТИК */
        .grown-bush-container { position: absolute; top: 47.4%; left: 50.8%; width: 110px; height: 110px; transform: translate(-50%, -50%); z-index: 20; cursor: pointer; pointer-events: auto; display: none; animation: wind-sway 4s ease-in-out infinite alternate; }
        .grown-bush-container.active { display: block; }
        .grown-bush-container:active { transform: translate(-50%, -50%) scale(0.9) !important; animation: none; }
        .grown-bush-container img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 8px 10px rgba(0,0,0,0.4)); mix-blend-mode: multiply; }
        
        .harvest-bubble { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); background: #ffdf00; color: #000; font-weight: bold; font-size: 20px; padding: 4px 12px; border-radius: 12px; border: 2px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.8); z-index: 25; animation: float-bubble 1.5s infinite alternate; pointer-events: none; }
        
        .boat-container { position: absolute; top: 77.8%; left: 60.9%; width: 150px; height: 100px; transform: translate(-50%, -50%); z-index: 14; pointer-events: none; animation: boat-rock 3s ease-in-out infinite alternate; }
        .boat-img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6)); }

        .surf-wave { position: absolute; width: 60px; height: 15px; border-bottom: 4px solid rgba(255, 255, 255, 0.4); border-radius: 50%; opacity: 0; pointer-events: none; z-index: 12; transform: translate(-50%, -50%); }
        #surf-l1 { top: 86.0%; left: 39.0%; animation: surf-left 4s infinite ease-in-out 0s; } 
        #surf-l2 { top: 89.0%; left: 43.0%; animation: surf-left 4.5s infinite ease-in-out 1.2s; } 
        #surf-l3 { top: 91.0%; left: 47.0%; animation: surf-left 5s infinite ease-in-out 2.5s; }
        #surf-r1 { top: 91.0%; left: 54.0%; animation: surf-right 4.2s infinite ease-in-out 0.8s; } 
        #surf-r2 { top: 89.0%; left: 58.0%; animation: surf-right 4.8s infinite ease-in-out 3s; } 
        #surf-r3 { top: 86.0%; left: 63.0%; animation: surf-right 5.5s infinite ease-in-out 1.5s; }

        @keyframes boat-rock { 0% { transform: translate(-50%, -50%) translateY(0px) rotate(-2deg); } 100% { transform: translate(-50%, -50%) translateY(5px) rotate(2deg); } }
        @keyframes wind-sway { 0% { transform: translate(-50%, -50%) skewX(-2deg) scale(1); } 100% { transform: translate(-50%, -50%) skewX(2deg) scale(1.02); } }
        @keyframes surf-left { 0% { transform: translate(-50%, -50%) rotate(-30deg) translate(-10px, 10px) scale(0.8); opacity: 0; } 50% { opacity: 1; } 100% { transform: translate(-50%, -50%) rotate(-30deg) translate(10px, -5px) scale(1.1); opacity: 0; } }
        @keyframes surf-right { 0% { transform: translate(-50%, -50%) rotate(30deg) translate(10px, 10px) scale(0.8); opacity: 0; } 50% { opacity: 1; } 100% { transform: translate(-50%, -50%) rotate(30deg) translate(-10px, -5px) scale(1.1); opacity: 0; } }
        @keyframes float-bubble { 0% { transform: translate(-50%, 0); } 100% { transform: translate(-50%, -8px); } }

        /* ПТИЦЫ */
        .flock-container { position: absolute; left: -50%; width: 50%; height: 150px; pointer-events: none; z-index: 11; opacity: 0.5; }
        .tiny-bird { position: absolute; width: 12px; height: 8px; fill: #1a2226; animation: bird-wander 3s ease-in-out infinite alternate; }
        @keyframes fly-across { 0% { transform: translateX(0px) translateY(0); } 100% { transform: translateX(4000px) translateY(100px); } }
        @keyframes fly-across-reverse { 0% { transform: translateX(4000px) translateY(0) scaleX(-1); } 100% { transform: translateX(0px) translateY(-100px) scaleX(-1); } }
        @keyframes bird-wander { 0% { transform: translate(0, 0) scale(var(--scale)); } 100% { transform: translate(var(--dx), var(--dy)) scale(var(--scale)); } }

        /* АНИМАЦИЯ ПЕРЕХОДА (Облака) */
        .clouds-transition { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; pointer-events: none; opacity: 1; transition: opacity 0.3s ease; }
        .clouds-transition.open { opacity: 0; visibility: hidden; transition: opacity 0.5s ease 0.8s, visibility 0s 1.3s; }
        .cloud-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: space-between; }
        .cloud-left, .cloud-right { position: relative; width: 60%; height: 100%; transition: transform 1.0s cubic-bezier(0.65, 0, 0.35, 1); }
        .cloud-left { left: 0; } .cloud-right { right: 0; }
        .cloud-left::before, .cloud-left::after, .cloud-right::before, .cloud-right::after, .cloud-right .fluff { content: ''; position: absolute; border-radius: 50%; background: inherit; }
        .cloud-left::before { width: 90%; aspect-ratio: 1; right: -25%; top: 15%; } .cloud-left::after { width: 110%; aspect-ratio: 1; right: -35%; top: 50%; }
        .cloud-right::before { width: 80%; aspect-ratio: 1; left: -25%; top: 5%; } .cloud-right::after { width: 100%; aspect-ratio: 1; left: -45%; top: 35%; }
        .cloud-right .fluff { width: 70%; aspect-ratio: 1; left: -20%; top: 75%; }
        .layer-3 .cloud-left, .cloud-layer.layer-3 .cloud-right { background: #8ba2c2; transition-duration: 1.4s; }
        .layer-2 .cloud-left, .cloud-layer.layer-2 .cloud-right { background: #b8c5d1; transition-duration: 1.1s; }
        .layer-1 .cloud-left, .cloud-layer.layer-1 .cloud-right { background: #f0f4f8; transition-duration: 0.8s; }
        .clouds-transition.open .cloud-left { transform: translateX(-150%); } .clouds-transition.open .cloud-right { transform: translateX(150%); }

        /* УНИВЕРСАЛЬНОЕ ИНФО-ОКНО */
        .info-modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px); z-index: 300; display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: opacity 0.3s, visibility 0.3s; }
        .info-modal-overlay.show { opacity: 1; visibility: visible; pointer-events: auto; }
        .info-modal { width: 80%; max-width: 320px; border-radius: 12px; overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.8); transform: scale(0.8); transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.2, 1); display: flex; flex-direction: column; }
        .info-modal-overlay.show .info-modal { transform: scale(1); }
        .info-modal-header { background: #23292b; color: #dcb254; padding: 15px; font-weight: bold; text-align: center; font-size: 16px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .info-modal-body { background: rgba(35, 41, 43, 0.85); color: #eef4f7; padding: 20px 15px; text-align: center; font-size: 15px; line-height: 1.4; backdrop-filter: blur(5px); white-space: pre-wrap; }
        .info-modal-footer { background: linear-gradient(135deg, #00bfff, #008ecc); padding: 12px; text-align: center; cursor: pointer; color: #fff; font-weight: bold; font-size: 16px; transition: filter 0.2s, background 0.2s; text-transform: uppercase; letter-spacing: 1px; }
        .info-modal-footer:active { filter: brightness(0.8); }

        /* ОКНО НАГРАД */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 13, 16, 0.8); backdrop-filter: blur(5px); z-index: 200; display: flex; justify-content: center; align-items: center; visibility: hidden; opacity: 0; transition: opacity 0.3s, visibility 0.3s; }
        .modal-overlay.show { opacity: 1; visibility: visible; pointer-events: auto; }
        .daily-modal { background: linear-gradient(135deg, #1f2427, #121517); border: 2px solid #dcb254; border-radius: 15px; width: 90%; max-width: 380px; padding: 25px 15px; text-align: center; box-shadow: 0 10px 30px #000; transform: scale(0.8); transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.2, 1); position: relative; }
        .modal-overlay.show .daily-modal { transform: scale(1); }
        .daily-title { color: #dcb254; font-size: 22px; font-weight: bold; margin-bottom: 5px; text-shadow: 0 2px 4px #000; }
        .daily-subtitle { color: #8ba2c2; font-size: 14px; margin-bottom: 20px; }
        .days-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
        .day-card { background: rgba(0,0,0,0.5); border: 1px solid #4a433a; border-radius: 8px; padding: 10px 5px; display: flex; flex-direction: column; align-items: center; gap: 5px; transition: transform 0.2s, box-shadow 0.2s; }
        .day-title { font-size: 12px; color: #8ba2c2; }
        .day-reward { font-size: 16px; font-weight: bold; color: #fcebbb; display: flex; align-items: center; gap: 3px;}
        .day-reward svg { width: 14px; height: 14px; fill: #dcb254; }
        .day-card.claimed { border-color: #8c6a23; opacity: 0.5; }
        .day-card.claimed .day-title { color: #8c6a23; text-decoration: line-through; }
        .day-card.active { background: rgba(32, 178, 170, 0.15); border-color: #20b2aa; box-shadow: 0 0 10px rgba(32,178,170,0.5); transform: scale(1.05); }
        .day-card.active .day-title { color: #20b2aa; font-weight: bold; }
        .day-card.active .day-reward { color: #fff; text-shadow: 0 0 5px #20b2aa; }
        .day-card.active .day-reward svg { fill: #fff; }
        .day-card:last-child { grid-column: span 3; background: linear-gradient(135deg, rgba(220,178,84,0.1), rgba(140,106,35,0.2)); border-color: #dcb254; flex-direction: row; justify-content: space-around; padding: 15px; }
        .day-card:last-child .day-title { font-size: 14px; color: #dcb254; font-weight: bold; }
        .day-card:last-child .day-reward { font-size: 20px; color: #ffdf00; }
        .day-card:last-child .day-reward svg { width: 18px; height: 18px; fill: #ffdf00; }
        .claim-btn { background: linear-gradient(135deg, #20b2aa, #137a75); border: 1px solid #fff; color: #fff; padding: 12px 30px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.8); transition: filter 0.2s, transform 0.2s; width: 100%; outline: none;}
        .claim-btn:hover:not(:disabled) { filter: brightness(1.2); }
        .claim-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 5px rgba(0,0,0,0.8); }
        .claim-btn:disabled { background: #3a3f42; border-color: #555; color: #888; cursor: not-allowed; box-shadow: none; }
        
        #loading-screen { position: absolute; top:0; left:0; width:100%; height:100%; background:#0a0c0f; z-index:99999; display:flex; justify-content:center; align-items:center; color:#dcb254; font-weight:bold; font-size:20px; transition:opacity 0.5s; }

        /* DEV MODE */
        body.dev-mode .map-pin, body.dev-mode .boat-container, body.dev-mode .grown-bush-container, body.dev-mode .surf-wave { 
            border: 3px dashed #ff0055 !important; background: rgba(255, 0, 85, 0.4) !important; 
            pointer-events: auto !important; cursor: move !important; animation: none !important;
        }
        body.dev-mode .map-pin::after, body.dev-mode .boat-container::after, body.dev-mode .grown-bush-container::after, body.dev-mode .surf-wave::after {
            content: attr(id); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; background: rgba(0,0,0,0.8); padding: 4px 8px; font-size: 16px; font-weight: bold; border-radius: 4px; pointer-events: none; white-space: nowrap;
        }
        #dev-coord-box { 
            display: none; position: absolute; top: 120px; left: 10px; right: 10px; max-height: 45vh; overflow-y: auto;
            background: rgba(0,0,0,0.85); color: #00ffcc; padding: 15px; border: 2px solid #00ffcc; 
            border-radius: 8px; z-index: 10000; font-family: monospace; font-size: 12px; font-weight: bold;
            pointer-events: none; text-align: left; white-space: pre-wrap; line-height: 1.5;
        }
        body.dev-mode #dev-coord-box { display: block; }
    </style>
</head>
<body>

  <div id="game-frame">
    <div id="loading-screen">Загрузка данных...</div>

    <!-- Панель координат -->
    <div id="dev-coord-box">Тащите любой красный квадрат пальцем!</div>

    <!-- ОБЕРТКА ДЛЯ КАМЕРЫ -->
    <div class="map-wrapper" id="map-wrapper">
        <div class="map-container" id="map-container">
            
            <!-- Прибой -->
            <div class="surf-wave" id="surf-l1"></div><div class="surf-wave" id="surf-l2"></div><div class="surf-wave" id="surf-l3"></div>
            <div class="surf-wave" id="surf-r1"></div><div class="surf-wave" id="surf-r2"></div><div class="surf-wave" id="surf-r3"></div>

            <!-- Лодка -->
            <div class="boat-container" id="boat">
                <img class="boat-img" src="boat.png" alt="Лодка" onerror="this.style.display='none'">
            </div>

            <!-- Птицы -->
            <div id="birds-layer"></div>

            <!-- КУСТИК ОГОРОДА -->
            <div class="grown-bush-container" id="grown-bush" onclick="harvestSand(event)">
                <img src="bush.png" alt="Выросший куст" onerror="this.style.display='none'">
                <div class="harvest-bubble" id="harvest-bubble" style="display:none;">+0</div>
            </div>

            <!-- НЕВИДИМЫЕ ЗОНЫ КЛИКА ПО ЗДАНИЯМ -->
            <div class="map-pin" id="pin-hall" onclick="handleBuildingClick(event, 'hall')"></div>
            <div class="map-pin" id="pin-lib" onclick="handleBuildingClick(event, 'lib')"></div>
            <div class="map-pin" id="pin-mpso" onclick="handleBuildingClick(event, 'mpso')"></div>
            <div class="map-pin" id="pin-gate" onclick="handleBuildingClick(event, 'gate')"></div>
            <div class="map-pin" id="pin-tent" onclick="handleBuildingClick(event, 'tent')">
                <div class="notification-dot" id="daily-dot"></div>
            </div>
            <div class="map-pin" id="pin-garden" onclick="handleBuildingClick(event, 'garden')"></div>

        </div>
    </div>

    <!-- ОБЛАКА ПЕРЕХОДА -->
    <div class="clouds-transition" id="clouds">
        <div class="cloud-layer layer-3"><div class="cloud-left"></div><div class="cloud-right"><div class="fluff"></div></div></div>
        <div class="cloud-layer layer-2"><div class="cloud-left"></div><div class="cloud-right"><div class="fluff"></div></div></div>
        <div class="cloud-layer layer-1"><div class="cloud-left"></div><div class="cloud-right"><div class="fluff"></div></div></div>
    </div>

    <!-- ВЕРХНИЙ БЛОК -->
    <div class="top-status-container">
        <div class="level-badge" onclick="showInfoModal('Уровень Эпохи', 'Ваш уровень Хранителя.\nПовышайте его, собирая опыт (XP) в рулетке!')">
            <svg class="level-gear-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.05-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62-.94l-2.39-.96c-.22-.08-.47 0-.59.22l-1.92 3.32c-.12.22-.07.49.12.61l2.03 1.58c-.04.3-.06.61-.06.94s.02.64.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .43-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.49-.12-.61L19.14,12.94z" /></svg>
            <span class="level-text" id="level-display">1</span>
        </div>
        <div class="top-progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
            <span class="xp-text" id="xp-text">0 / 50</span>
        </div>
        <div class="level-up-badge">
            <svg class="level-up-gear" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.05-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62-.94l-2.39-.96c-.22-.08-.47 0-.59.22l-1.92 3.32c-.12.22-.07.49.12.61l2.03 1.58c-.04.3-.06.61-.06.94s.02.64.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .43-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.49-.12-.61L19.14,12.94z" /></svg>
            <span class="level-up-arrow">↑</span>
        </div>
    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="bottom-menu">
        <div class="menu-side-group" style="justify-content: flex-start;">
            <div class="square-btn" onclick="toggleDevMode()" title="Режим разработчика" style="border-color: #a6ff4d; color: #a6ff4d; font-weight: bold; font-size: 13px;">
                DEV
            </div>
        </div>
        
        <div class="center-sand-wrapper" onclick="showInfoModal('Песчинки Времени', 'У вас ' + window.gameData.sandCount + ' песчинок!\nТратьте их во Вратах Времени.')">
            <img src="ty.png" class="boy-avatar" alt="Мальчик" onerror="this.style.display='none'">
            <div class="boy-sand-counter">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M18 2H6v4.46l4.08 5.54L6 17.54V22h12v-4.46l-4.08-5.54L18 6.46V2zm-2 18H8v-1.46l4-5.43 4 5.43V20zM8 4h8v1.46l-4 5.43-4-5.43V4z"/></svg>
                <span id="sand-display">0</span>
            </div>
        </div>

        <div class="menu-side-group" style="justify-content: flex-end;">
            <div class="square-btn" onclick="logout()" title="Выйти из игры">
                <img src="logout_icon.png" alt="Выход" onerror="this.style.display='none'">
            </div>
        </div>
    </div>

    <!-- ОКНО ЕЖЕДНЕВНЫХ НАГРАД -->
    <div class="modal-overlay" id="daily-overlay">
        <div class="daily-modal">
            <div class="close-modal-btn" onclick="closeDailyModal()">×</div>
            <h2 class="daily-title">Пропуск</h2>
            <p class="daily-subtitle">Заходите каждый день и получайте Песчинки!</p>
            <div class="days-grid" id="days-grid"></div>
            <button class="claim-btn" id="claim-btn" onclick="claimDailyReward()">Забрать награду</button>
        </div>
    </div>

    <!-- УНИВЕРСАЛЬНОЕ ИНФО-ОКНО -->
    <div class="info-modal-overlay" id="info-modal-overlay" onclick="closeInfoModal(event)">
        <div class="info-modal" id="info-modal" onclick="event.stopPropagation()">
            <div class="info-modal-header" id="info-modal-title">Внимание</div>
            <div class="info-modal-body" id="info-modal-text">Текст сообщения</div>
            <div class="info-modal-footer" onclick="closeInfoModal()">Отлично</div>
        </div>
    </div>

  </div>

    <!-- ПОДКЛЮЧЕНИЕ БАЗЫ ДАННЫХ И ЛОГИКА -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

        const userUid = localStorage.getItem('userUid');
        if (!userUid) { window.location.replace('login.html'); }

        const firebaseConfig = {
            apiKey: "AIzaSyDFCGFnL3pNfrHiwqCZkXapdhC5bKmg_SE",
            authDomain: "time-gate-game.firebaseapp.com",
            projectId: "time-gate-game",
            storageBucket: "time-gate-game.firebasestorage.app",
            messagingSenderId: "789791906588",
            appId: "1:789791906588:web:5bf53149ff3b14de9178d9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const userDocRef = doc(db, "users", userUid);

        window.gameData = {};
        const dailyRewards = [10, 15, 20, 25, 30, 50, 100];

        async function loadDataFromCloud() {
            try {
                const docSnap = await getDoc(userDocRef);
                if (docSnap.exists()) window.gameData = docSnap.data();
                else window.gameData = { sandCount: 150, epochLevel: 1, currentXP: 0, targetXP: 50, loginStreak: 0, lastClaimDate: null, gardenWaterUsed: 0, lastHarvestTime: null };
            } catch (error) {
                console.error("Ошибка загрузки:", error);
                window.gameData = { sandCount: 150, epochLevel: 1, currentXP: 0, targetXP: 50, loginStreak: 0, lastClaimDate: null, gardenWaterUsed: 0, lastHarvestTime: null };
            } finally {
                document.getElementById('loading-screen').style.opacity = '0';
                setTimeout(() => document.getElementById('loading-screen').style.display = 'none', 500);
                
                updateUI(); checkDailyStatus(); checkBushVisibility(); createBirdsFlock(); 
                setInterval(checkHarvest, 60000); 
                setTimeout(() => { document.getElementById('clouds').classList.add('open'); }, 200);
            }
        }

        async function saveDataToCloud() {
            try { await updateDoc(userDocRef, window.gameData); } catch (error) { console.error("Ошибка сохранения:", error); }
        }

        loadDataFromCloud();

        // -------------------------
        // ЛОГИКА КАМЕРЫ (PAN & ZOOM) - ИСПРАВЛЕННЫЕ ГРАНИЦЫ
        // -------------------------
        const mapWrapper = document.getElementById('map-wrapper');
        const mapContainer = document.getElementById('map-container');

        let mapScale = null; 
        const maxScale = 3.0; 

        let posX = 0, posY = 0;
        let startX, startY, startDistance = 0, initialScale = 1;
        let isDraggingMap = false;
        let hasMovedMap = false; 
        let isFirstLoad = true;

        mapWrapper.addEventListener('touchstart', (e) => {
            if(window.activeDragEl) return; 
            hasMovedMap = false;
            if (e.touches.length === 2) {
                isDraggingMap = false;
                startDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                initialScale = mapScale;
            } else if (e.touches.length === 1) {
                isDraggingMap = true;
                startX = e.touches[0].pageX - posX;
                startY = e.touches[0].pageY - posY;
            }
        }, { passive: false });

        mapWrapper.addEventListener('touchmove', (e) => {
            if(window.activeDragEl) return;
            if (e.cancelable) e.preventDefault(); 
            hasMovedMap = true;
            if (e.touches.length === 2) {
                let currentDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                let zoom = currentDistance / startDistance;
                mapScale = initialScale * zoom;
                updateTransform();
            } else if (e.touches.length === 1 && isDraggingMap) {
                posX = e.touches[0].pageX - startX;
                posY = e.touches[0].pageY - startY;
                updateTransform();
            }
        }, { passive: false });

        mapWrapper.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) initialScale = mapScale;
            if (e.touches.length === 0) isDraggingMap = false;
            updateTransform();
        });

        function updateTransform() {
            const fw = mapWrapper.clientWidth;
            const fh = mapWrapper.clientHeight;
            const cw = mapContainer.clientWidth;
            const ch = mapContainer.clientHeight;
            
            // Жестко блокируем зум, чтобы НИКОГДА не видеть края экрана
            const calculatedMinScale = Math.max(fw / cw, fh / ch);
            
            if (mapScale === null) {
                mapScale = Math.max(calculatedMinScale, 0.9); // Стартовый масштаб
            }
            
            mapScale = Math.max(calculatedMinScale, Math.min(mapScale, maxScale));

            const scaledW = cw * mapScale;
            const scaledH = ch * mapScale;

            const maxTx = Math.max(0, (scaledW - fw) / 2 / mapScale);
            const maxTy = Math.max(0, (scaledH - fh) / 2 / mapScale);

            if (isFirstLoad) {
                // Поднимаем камеру (значения от 0 до maxTy, где maxTy - самый верх картинки)
                posY = maxTy * 0.6; 
                isFirstLoad = false;
            }

            // Блокируем перемещение за края экрана
            posX = Math.max(-maxTx, Math.min(posX, maxTx));
            posY = Math.max(-maxTy, Math.min(posY, maxTy));

            mapContainer.style.transform = `scale(${mapScale}) translate(${posX}px, ${posY}px)`;
        }
        
        window.addEventListener('resize', updateTransform);
        setTimeout(updateTransform, 50);

        // -------------------------
        // СУПЕР ИНСТРУМЕНТ РАЗРАБОТЧИКА (DEV MODE - DRAG & DROP)
        // -------------------------
        window.toggleDevMode = function() {
            document.body.classList.toggle('dev-mode');
            updateDevSummary();
        };

        window.activeDragEl = null;
        const draggables = document.querySelectorAll('.map-pin, .boat-container, .grown-bush-container, .surf-wave');
        
        draggables.forEach(el => {
            let startClientX, startClientY, startElLeft, startElTop;

            el.addEventListener('touchstart', (e) => {
                if (!document.body.classList.contains('dev-mode')) return;
                e.stopPropagation(); 
                window.activeDragEl = el;
                const touch = e.touches[0];
                startClientX = touch.clientX;
                startClientY = touch.clientY;
                startElLeft = parseFloat(el.style.left) || (el.offsetLeft / mapContainer.clientWidth * 100);
                startElTop = parseFloat(el.style.top) || (el.offsetTop / mapContainer.clientHeight * 100);
            }, {passive: false});

            el.addEventListener('touchmove', (e) => {
                if (!document.body.classList.contains('dev-mode') || window.activeDragEl !== el) return;
                e.preventDefault(); e.stopPropagation();
                
                const touch = e.touches[0];
                const dx = (touch.clientX - startClientX) / mapScale;
                const dy = (touch.clientY - startClientY) / mapScale;
                
                const dPercentX = (dx / mapContainer.clientWidth) * 100;
                const dPercentY = (dy / mapContainer.clientHeight) * 100;
                
                el.style.left = (startElLeft + dPercentX).toFixed(1) + '%';
                el.style.top = (startElTop + dPercentY).toFixed(1) + '%';
                updateDevSummary();
            }, {passive: false});

            el.addEventListener('touchend', (e) => {
                if (window.activeDragEl === el) window.activeDragEl = null;
            });
        });

        function updateDevSummary() {
            if (!document.body.classList.contains('dev-mode')) return;
            const box = document.getElementById('dev-coord-box');
            let txt = "🔥 РЕЖИМ РЕДАКТОРА 🔥\nТащите квадраты пальцем. Сделайте скриншот этого окна:\n\n";
            draggables.forEach(el => {
                let id = el.id || "Без ID";
                let t = el.style.top || (el.offsetTop / mapContainer.clientHeight * 100).toFixed(1) + '%';
                let l = el.style.left || (el.offsetLeft / mapContainer.clientWidth * 100).toFixed(1) + '%';
                txt += `${id}: top ${t}, left ${l}\n`;
            });
            box.innerText = txt;
        }

        // -------------------------
        // ИНФО-ОКНО И ЗДАНИЯ
        // -------------------------
        window.showInfoModal = function(title, text) {
            document.getElementById('info-modal-title').innerText = title;
            document.getElementById('info-modal-text').innerText = text;
            document.getElementById('info-modal-overlay').classList.add('show');
        };

        window.closeInfoModal = function(e) {
            if (e && e.target !== document.getElementById('info-modal-overlay')) return;
            document.getElementById('info-modal-overlay').classList.remove('show');
        };

        window.handleBuildingClick = function(e, buildingType) {
            if (document.body.classList.contains('dev-mode')) return;
            if (hasMovedMap) return; 
            
            const level = window.gameData.epochLevel || 1;
            
            if (buildingType === 'hall') {
                if (level < 2) window.showInfoModal("Заблокировано", "🔒 Зал Царства откроется на 2 уровне эпохи!");
                else window.showInfoModal("Зал Царства", "Место встреч и духовного обучения.\nВ разработке!");
            } 
            else if (buildingType === 'lib') {
                if (level < 5) window.showInfoModal("Заблокировано", "🔒 Библиотека откроется на 5 уровне эпохи!");
                else window.showInfoModal("Библиотека", "Архивные карточки и события.\nВ разработке!");
            } 
            else if (buildingType === 'mpso') {
                if (level < 10) window.showInfoModal("Заблокировано", "🔒 МПСО откроется на 10 уровне эпохи!");
                else window.showInfoModal("МПСО", "Управление строительством.\nВ разработке!");
            }
            else if (buildingType === 'gate') {
                goToLocation('gate.html');
            }
            else if (buildingType === 'tent') {
                openDailyModal();
            }
            else if (buildingType === 'garden') {
                goToLocation('garden.html');
            }
        };

        // -------------------------
        // ОСТАЛЬНАЯ ЛОГИКА
        // -------------------------
        function checkBushVisibility() {
            if(typeof window.gameData.gardenWaterUsed === 'undefined') return;
            let treesGrown = Math.floor(window.gameData.gardenWaterUsed / 7);
            let bushContainer = document.getElementById('grown-bush');
            if (treesGrown >= 1) {
                bushContainer.classList.add('active');
                if (!window.gameData.lastHarvestTime) { window.gameData.lastHarvestTime = Date.now(); saveDataToCloud(); }
                checkHarvest(); 
            } else { bushContainer.classList.remove('active'); }
        }

        function checkHarvest() {
            let treesGrown = Math.floor(window.gameData.gardenWaterUsed / 7);
            if (treesGrown < 1 || !window.gameData.lastHarvestTime) return;
            let msPassed = Date.now() - window.gameData.lastHarvestTime;
            let accumulated = Math.floor((msPassed / 86400000) * (60 * treesGrown));
            let bubble = document.getElementById('harvest-bubble');
            if (accumulated > 0) { bubble.innerText = `+${accumulated}`; bubble.style.display = 'block'; } 
            else { bubble.style.display = 'none'; }
        }

        window.harvestSand = async function(e) {
            if (document.body.classList.contains('dev-mode')) return; 
            e.stopPropagation();
            if (hasMovedMap) return;

            let treesGrown = Math.floor(window.gameData.gardenWaterUsed / 7);
            if (treesGrown < 1) return;
            let msPassed = Date.now() - window.gameData.lastHarvestTime;
            let msPerSand = 86400000 / (60 * treesGrown);
            let accumulated = Math.floor(msPassed / msPerSand);
            if (accumulated > 0) {
                window.gameData.sandCount += accumulated;
                window.gameData.lastHarvestTime += accumulated * msPerSand;
                updateUI(); checkHarvest(); showFloatingText(e.clientX, e.clientY, `+${accumulated} ⏳`);
                await saveDataToCloud();
            } else { window.showInfoModal("Сбор", `Песчинки еще копятся!\nВаши кусты дают ${60 * treesGrown} шт. в сутки.`); }
        };

        function showFloatingText(x, y, text) {
            let el = document.createElement('div'); el.innerText = text; el.style.position = 'fixed'; el.style.left = (x - 20) + 'px'; el.style.top = y + 'px'; el.style.color = '#ffdf00'; el.style.fontWeight = 'bold'; el.style.fontSize = '20px'; el.style.textShadow = '0 2px 4px #000'; el.style.pointerEvents = 'none'; el.style.zIndex = '1000'; el.style.transition = 'all 1s ease-out'; document.body.appendChild(el);
            setTimeout(() => { el.style.transform = 'translateY(-50px)'; el.style.opacity = '0'; }, 50);
            setTimeout(() => { el.remove(); }, 1050);
        }

        function createBirdsFlock() {
            const birdsLayer = document.getElementById('birds-layer');
            for(let f = 0; f < 2; f++) {
                let flock = document.createElement('div'); flock.className = 'flock-container'; 
                flock.style.top = (25 + f * 15) + '%';
                
                if(f === 0) flock.style.animation = `fly-across 45s linear infinite ${f * 10}s`; 
                else flock.style.animation = `fly-across-reverse 50s linear infinite ${f * 20}s`;
                
                for(let i = 0; i < 15; i++) {
                    let bird = document.createElementNS("http://www.w3.org/2000/svg", "svg"); bird.setAttribute("viewBox", "0 0 30 20"); bird.classList.add("tiny-bird");
                    bird.style.left = (Math.random() * 100) + 'px'; bird.style.top = (Math.random() * 80) + 'px';
                    let randomScale = 0.3 + Math.random() * 0.7;
                    bird.style.setProperty('--dx', (Math.random() * 40 - 20) + 'px'); bird.style.setProperty('--dy', (Math.random() * 40 - 20) + 'px'); bird.style.setProperty('--scale', randomScale);
                    bird.style.animationDelay = (Math.random() * 4) + 's'; bird.style.animationDuration = (2 + Math.random() * 3) + 's';
                    let path = document.createElementNS("http://www.w3.org/2000/svg", "path"); path.setAttribute("d", "M0,10 Q5,0 15,10 Q25,0 30,10 Q25,5 15,15 Q5,5 0,10 Z");
                    bird.appendChild(path); flock.appendChild(bird);
                }
                birdsLayer.appendChild(flock);
            }
        }

        function updateUI() {
            document.getElementById('level-display').innerText = window.gameData.epochLevel || 1;
            document.getElementById('sand-display').innerText = window.gameData.sandCount || 0;
            document.getElementById('xp-text').innerText = `${Math.floor(window.gameData.currentXP)} / ${window.gameData.targetXP}`;
            let fillPercent = (window.gameData.currentXP / window.gameData.targetXP) * 100;
            document.getElementById('progress-fill').style.width = fillPercent + '%';
        }

        function checkDailyStatus() {
            let today = new Date().toDateString(); let canClaim = (window.gameData.lastClaimDate !== today);
            let tentPin = document.getElementById('pin-tent');
            if (canClaim) { document.getElementById('daily-dot').classList.add('active'); } 
            else { document.getElementById('daily-dot').classList.remove('active'); }
        }

        window.openDailyModal = function() { 
            if (hasMovedMap || document.body.classList.contains('dev-mode')) return;
            renderDaysGrid(); document.getElementById('daily-overlay').classList.add('show'); 
        };
        window.closeDailyModal = function() { document.getElementById('daily-overlay').classList.remove('show'); };

        function renderDaysGrid() {
            let grid = document.getElementById('days-grid'); grid.innerHTML = '';
            let today = new Date().toDateString(); let canClaimToday = (window.gameData.lastClaimDate !== today);
            let currentDayIndex = window.gameData.loginStreak % 7;
            for (let i = 0; i < 7; i++) {
                let card = document.createElement('div'); card.className = 'day-card';
                let title = document.createElement('div'); title.className = 'day-title'; title.innerText = `День ${i + 1}`;
                let reward = document.createElement('div'); reward.className = 'day-reward';
                reward.innerHTML = `<svg viewBox="0 0 24 24"><path d="M18 2H6v4.46l4.08 5.54L6 17.54V22h12v-4.46l-4.08-5.54L18 6.46V2zm-2 18H8v-1.46l4-5.43 4 5.43V20zM8 4h8v1.46l-4 5.43-4-5.43V4z"/></svg>${dailyRewards[i]}`;
                if (i < currentDayIndex) { card.classList.add('claimed'); } 
                else if (i === currentDayIndex) { if (canClaimToday) { card.classList.add('active'); } else { card.classList.add('claimed'); } }
                card.appendChild(title); card.appendChild(reward); grid.appendChild(card);
            }
            let btn = document.getElementById('claim-btn');
            if (canClaimToday) { btn.disabled = false; btn.innerText = "Забрать награду"; } 
            else { btn.disabled = true; btn.innerText = "Возвращайтесь завтра"; }
        }

        window.claimDailyReward = async function() {
            let today = new Date().toDateString();
            if (window.gameData.lastClaimDate === today) return; 
            let currentDayIndex = window.gameData.loginStreak % 7;
            let reward = dailyRewards[currentDayIndex];
            window.gameData.sandCount += reward; window.gameData.lastClaimDate = today; window.gameData.loginStreak++;
            updateUI(); checkDailyStatus(); renderDaysGrid(); 
            await saveDataToCloud();
            let btn = document.getElementById('claim-btn'); btn.innerText = `Получено +${reward} ⏳!`;
            setTimeout(() => { window.closeDailyModal(); }, 1500);
        };

        window.goToLocation = function(url) {
            if (hasMovedMap || document.body.classList.contains('dev-mode')) return;
            document.getElementById('clouds').classList.remove('open');
            setTimeout(() => { window.location.replace(url); }, 1200);
        };

        window.logout = function() {
            localStorage.removeItem('userUid');
            window.location.replace('login.html');
        };
    </script>
