<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Лагерь Времени</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        /* --- ЧЕРНЫЙ ФОН БРАУЗЕРА (ДЛЯ ПК) --- */
        body { 
            background-color: #050505; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; width: 100vw; margin: 0; overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, sans-serif; color: #fff; 
        }

        /* --- ИГРОВОЙ КАДР (ПРИВЯЗКА МАКСИМУМ 540x960) --- */
        #game-frame {
            position: relative;
            width: 100%; height: 100%;
            max-width: 540px; max-height: 960px;
            background-color: #0a0c0f; overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
        }
        @media (min-width: 540px) and (min-height: 960px) {
            #game-frame { border-radius: 12px; border: 1px solid #333; }
        }

        /* --- АНИМАЦИЯ ПЕРЕХОДА (ОБЛАКА ВНУТРИ КАДРА) --- */
        .clouds-transition { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; pointer-events: none; opacity: 1; transition: opacity 0.3s ease; }
        .clouds-transition.open { opacity: 0; visibility: hidden; transition: opacity 0.5s ease 0.8s, visibility 0s 1.3s; }
        .cloud-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: space-between; }
        .cloud-left, .cloud-right { position: relative; width: 60%; height: 100%; transition: transform 1.0s cubic-bezier(0.65, 0, 0.35, 1); }
        .cloud-left { left: 0; } .cloud-right { right: 0; }
        .cloud-left::before, .cloud-left::after, .cloud-right::before, .cloud-right::after, .cloud-right .fluff { content: ''; position: absolute; border-radius: 50%; background: inherit; }
        
        /* Заменены vh на проценты для адаптации внутри кадра */
        .cloud-left::before { width: 90%; aspect-ratio: 1; right: -25%; top: 15%; }
        .cloud-left::after { width: 110%; aspect-ratio: 1; right: -35%; top: 50%; }
        .cloud-right::before { width: 80%; aspect-ratio: 1; left: -25%; top: 5%; }
        .cloud-right::after { width: 100%; aspect-ratio: 1; left: -45%; top: 35%; }
        .cloud-right .fluff { width: 70%; aspect-ratio: 1; left: -20%; top: 75%; }
        
        .layer-3 .cloud-left, .layer-3 .cloud-right { background: #8ba2c2; transition-duration: 1.4s; }
        .layer-2 .cloud-left, .layer-2 .cloud-right { background: #b8c5d1; transition-duration: 1.1s; }
        .layer-1 .cloud-left, .layer-1 .cloud-right { background: #f0f4f8; transition-duration: 0.8s; }
        .clouds-transition.open .cloud-left { transform: translateX(-150%); }
        .clouds-transition.open .cloud-right { transform: translateX(150%); }

        /* --- ЗАДНИЙ ФОН И ЗВЕЗДЫ --- */
        .stars { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; background-image: radial-gradient(circle at 15% 50%, rgba(255,255,255,0.05) 1px, transparent 1px), radial-gradient(circle at 85% 30%, rgba(255,255,255,0.05) 1px, transparent 1px), radial-gradient(circle at 50% 80%, rgba(255,255,255,0.05) 2px, transparent 2px); background-size: 100px 100px; animation: starDrift 60s linear infinite; }
        @keyframes starDrift { from { transform: translateY(0); } to { transform: translateY(-100px); } }
        .glow-bg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; height: 100%; max-width: 800px; max-height: 800px; background: radial-gradient(circle, rgba(32, 178, 170, 0.1) 0%, transparent 60%); z-index: 1; pointer-events: none; }

        /* --- ВЕРХНИЙ ИНТЕРФЕЙС --- */
        .top-ui { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 100; pointer-events: none; }
        
        .left-stats { display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }
        
        .level-badge { display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.6); padding: 5px 15px 5px 5px; border-radius: 30px; border: 1px solid #4a433a; box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer; transition: transform 0.2s; }
        .level-badge:active { transform: scale(0.95); }
        .level-icon { width: 40px; height: 40px; background: radial-gradient(circle, #dcb254, #8c6a23); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: 900; font-size: 20px; color: #121517; box-shadow: inset 0 0 5px #ffdf00, 0 0 10px #dcb254; }
        .level-text { font-size: 14px; color: #fcebbb; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }

        .sand-counter { display: inline-flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.6); padding: 8px 20px; border-radius: 20px; border: 1px solid #dcb254; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: max-content; }
        .sand-counter svg { width: 18px; height: 18px; fill: #ffdf00; filter: drop-shadow(0 0 5px #ffdf00); }
        .sand-counter span { font-size: 18px; font-weight: bold; color: #ffdf00; text-shadow: 0 2px 4px #000; }

        /* ИКОНКА ЕЖЕДНЕВНЫХ НАГРАД (PASS) */
        .daily-btn { pointer-events: auto; background: rgba(0,0,0,0.6); border: 2px solid #20b2aa; border-radius: 50%; width: 50px; height: 50px; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 15px rgba(32,178,170,0.4); cursor: pointer; transition: transform 0.3s, box-shadow 0.3s; animation: dailyPulse 2s infinite alternate; position: relative; }
        .daily-btn:active { transform: scale(0.9); }
        .daily-btn svg { width: 24px; height: 24px; fill: #fcebbb; }
        @keyframes dailyPulse { 0% { box-shadow: 0 0 10px rgba(32,178,170,0.4); transform: scale(1); } 100% { box-shadow: 0 0 25px rgba(32,178,170,0.8); transform: scale(1.05); } }
        /* Индикатор, что награда готова */
        .notification-dot { position: absolute; top: -2px; right: -2px; width: 14px; height: 14px; background: #ff4500; border: 2px solid #0a0c0f; border-radius: 50%; display: none; }
        .notification-dot.active { display: block; }

        /* --- ПАРЯЩИЕ ОСТРОВА (ЛОКАЦИИ) --- */
        .village-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; overflow: hidden; z-index: 10; }
        
        .island { position: absolute; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .island:hover { transform: scale(1.1) translateY(-10px); z-index: 50; }
        .island:active { transform: scale(0.95); }
        
        .island-base { width: 120px; height: 40px; background: radial-gradient(ellipse at center, #2a3136 0%, #121517 70%); border-radius: 50%; box-shadow: 0 10px 20px rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,255,255,0.1); position: relative; margin-top: -15px; z-index: 1; }
        .island-base::after { content: ''; position: absolute; top: 20px; left: 10%; width: 80%; height: 30px; background: #121517; border-radius: 0 0 50px 50px; clip-path: polygon(0 0, 100% 0, 80% 100%, 20% 100%); }

        .island-title { background: rgba(0,0,0,0.7); border: 1px solid #4a433a; padding: 4px 12px; border-radius: 10px; font-size: 12px; font-weight: bold; color: #fcebbb; margin-top: 15px; text-shadow: 0 2px 4px #000; transition: color 0.3s, border-color 0.3s; z-index: 10; pointer-events: none; }
        .island:hover .island-title { color: #ffdf00; border-color: #dcb254; }

        /* Остров 1: Центр (ВРАТА) */
        .island-center { top: 40%; left: 50%; transform: translate(-50%, -50%); animation: float-main 4s ease-in-out infinite; z-index: 10; }
        .island-center .island-base { width: 160px; height: 50px; box-shadow: 0 10px 30px rgba(32,178,170,0.4), inset 0 2px 5px rgba(255,255,255,0.2); }
        .portal-building { width: 100px; height: 100px; position: relative; z-index: 2; display: flex; justify-content: center; align-items: center; }
        .portal-ring { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 4px solid transparent; border-top-color: #20b2aa; border-bottom-color: #20b2aa; animation: spin 4s linear infinite; box-shadow: 0 0 15px #20b2aa, inset 0 0 15px #20b2aa; }
        .portal-ring-2 { position: absolute; width: 80%; height: 80%; border-radius: 50%; border: 3px solid transparent; border-left-color: #dcb254; border-right-color: #dcb254; animation: spin-reverse 3s linear infinite; box-shadow: 0 0 10px #dcb254; }
        .portal-core { width: 40%; height: 40%; background: #fff; border-radius: 50%; box-shadow: 0 0 20px #fff, 0 0 40px #20b2aa; animation: pulse-core 2s infinite alternate; }

        /* Остров 2: Слева (БИБЛИОТЕКА) */
        .island-left { top: 60%; left: 15%; transform: translate(-50%, -50%); animation: float-alt 5s ease-in-out infinite 1s; }
        .archive-building { width: 80px; height: 80px; z-index: 2; display: flex; justify-content: center; align-items: flex-end; position: relative; }
        .archive-building svg { width: 100%; height: 100%; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.8)); transition: filter 0.3s; }
        .island:hover .archive-building svg { filter: drop-shadow(0 0 15px rgba(220,178,84,0.6)); }

        /* Остров 3: Справа (ЗАЛ ЦАРСТВА) */
        .island-right { top: 60%; left: 85%; transform: translate(-50%, -50%); animation: float-alt 4.5s ease-in-out infinite 0.5s; }
        .hof-building { width: 70px; height: 80px; z-index: 2; position: relative; }
        .hof-building svg { width: 100%; height: 100%; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.8)); }
        .island:hover .hof-building svg { filter: drop-shadow(0 0 15px rgba(255,223,0,0.6)); }

        /* Остров 4: Снизу (МПСО) */
        .island-bottom { top: 80%; left: 50%; transform: translate(-50%, -50%); animation: float-alt 5.5s ease-in-out infinite 2s; }
        .island-bottom .island-base { width: 100px; height: 35px; }
        .mine-building { width: 60px; height: 60px; z-index: 2; position: relative; display: flex; justify-content: center; align-items: center; }
        .mine-building svg { width: 100%; height: 100%; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.8)); }

        @keyframes float-main { 0%, 100% { top: 40%; } 50% { top: 38%; } }
        @keyframes float-alt { 0%, 100% { margin-top: 0px; } 50% { margin-top: -15px; } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
        @keyframes pulse-core { 0% { transform: scale(0.8); opacity: 0.8; } 100% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 30px #fff, 0 0 60px #20b2aa; } }

        /* --- ВСПЛЫВАЮЩЕЕ ОКНО НАГРАД (MODAL) --- */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 13, 16, 0.8); backdrop-filter: blur(5px); z-index: 200; display: flex; justify-content: center; align-items: center; visibility: hidden; opacity: 0; transition: opacity 0.3s, visibility 0.3s; }
        .modal-overlay.show { opacity: 1; visibility: visible; pointer-events: auto; }
        
        .daily-modal { background: linear-gradient(135deg, #1f2427, #121517); border: 2px solid #dcb254; border-radius: 15px; width: 90%; max-width: 380px; padding: 25px 15px; text-align: center; box-shadow: 0 10px 30px #000; transform: scale(0.8); transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.2, 1); position: relative; }
        .modal-overlay.show .daily-modal { transform: scale(1); }
        
        .daily-title { color: #dcb254; font-size: 22px; font-weight: bold; margin-bottom: 5px; text-shadow: 0 2px 4px #000; }
        .daily-subtitle { color: #8ba2c2; font-size: 14px; margin-bottom: 20px; }

        .days-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
        .day-card { background: rgba(0,0,0,0.5); border: 1px solid #4a433a; border-radius: 8px; padding: 10px 5px; display: flex; flex-direction: column; align-items: center; gap: 5px; transition: transform 0.2s, box-shadow 0.2s; }
        .day-title { font-size: 12px; color: #8ba2c2; }
        .day-reward { font-size: 16px; font-weight: bold; color: #fcebbb; display: flex; align-items: center; gap: 3px;}
        .day-reward svg { width: 14px; height: 14px; fill: #dcb254; }
        
        /* Состояния карточек */
        .day-card.claimed { border-color: #8c6a23; opacity: 0.5; }
        .day-card.claimed .day-title { color: #8c6a23; text-decoration: line-through; }
        
        .day-card.active { background: rgba(32, 178, 170, 0.15); border-color: #20b2aa; box-shadow: 0 0 10px rgba(32,178,170,0.5); transform: scale(1.05); }
        .day-card.active .day-title { color: #20b2aa; font-weight: bold; }
        .day-card.active .day-reward { color: #fff; text-shadow: 0 0 5px #20b2aa; }
        .day-card.active .day-reward svg { fill: #fff; }

        .day-card:last-child { grid-column: span 3; background: linear-gradient(135deg, rgba(220,178,84,0.1), rgba(140,106,35,0.2)); border-color: #dcb254; flex-direction: row; justify-content: space-around; padding: 15px; }
        .day-card:last-child .day-title { font-size: 14px; color: #dcb254; font-weight: bold; }
        .day-card:last-child .day-reward { font-size: 20px; color: #ffdf00; }
        .day-card:last-child .day-reward svg { width: 18px; height: 18px; fill: #ffdf00; }

        .claim-btn { background: linear-gradient(135deg, #20b2aa, #137a75); border: 1px solid #fff; color: #fff; padding: 12px 30px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.8); transition: filter 0.2s, transform 0.2s; width: 100%; outline: none;}
        .claim-btn:hover:not(:disabled) { filter: brightness(1.2); }
        .claim-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 5px rgba(0,0,0,0.8); }
        .claim-btn:disabled { background: #3a3f42; border-color: #555; color: #888; cursor: not-allowed; box-shadow: none; }

        .close-modal-btn { position: absolute; top: -10px; right: -10px; width: 30px; height: 30px; background: #121517; border: 2px solid #dcb254; border-radius: 50%; color: #dcb254; font-weight: bold; font-size: 16px; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 2px 5px #000; }
        .close-modal-btn:active { transform: scale(0.9); }

        .bottom-hint { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; text-align: center; color: #8ba2c2; font-size: 13px; font-style: italic; pointer-events: none; animation: pulse-text 2s infinite alternate; z-index: 100;}
        @keyframes pulse-text { 0% { opacity: 0.5; } 100% { opacity: 1; } }

    </style>
</head>
<body>

  <!-- ГЛАВНЫЙ ИГРОВОЙ КАДР -->
  <div id="game-frame">

    <!-- ОБЛАКА ПЕРЕХОДА -->
    <div class="clouds-transition" id="clouds">
        <div class="cloud-layer layer-3"><div class="cloud-left"></div><div class="cloud-right"><div class="fluff"></div></div></div>
        <div class="cloud-layer layer-2"><div class="cloud-left"></div><div class="cloud-right"><div class="fluff"></div></div></div>
        <div class="cloud-layer layer-1"><div class="cloud-left"></div><div class="cloud-right"><div class="fluff"></div></div></div>
    </div>

    <div class="stars"></div>
    <div class="glow-bg"></div>

    <!-- ИНТЕРФЕЙС -->
    <div class="top-ui">
        <div class="left-stats">
            <div class="level-badge" onclick="alert('Ваш уровень Хранителя. Повышайте его, собирая опыт (XP) в путешествиях!')">
                <div class="level-icon" id="village-level">1</div>
                <div class="level-text">Эпоха</div>
            </div>
            <div class="sand-counter">
                <svg viewBox="0 0 24 24"><path d="M18 2H6v4.46l4.08 5.54L6 17.54V22h12v-4.46l-4.08-5.54L18 6.46V2zm-2 18H8v-1.46l4-5.43 4 5.43V20zM8 4h8v1.46l-4 5.43-4-5.43V4z"/></svg>
                <span id="village-sand">0</span>
            </div>
        </div>

        <!-- КНОПКА ЕЖЕДНЕВНОГО ПРОПУСКА -->
        <div class="daily-btn" onclick="openDailyModal()">
            <div class="notification-dot" id="daily-dot"></div>
            <!-- Иконка Календаря/Подарка -->
            <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5z"/></svg>
        </div>
    </div>

    <!-- ПАРЯЩАЯ ДЕРЕВНЯ -->
    <div class="village-container">
        
        <!-- ЦЕНТР: ВРАТА (ССЫЛКА ИЗМЕНЕНА НА gate.html) -->
        <div class="island island-center" onclick="goToLocation('gate.html')">
            <div class="portal-building">
                <div class="portal-ring"></div>
                <div class="portal-ring-2"></div>
                <div class="portal-core"></div>
            </div>
            <div class="island-base"></div>
            <div class="island-title">Врата</div>
        </div>

        <!-- СЛЕВА: БИБЛИОТЕКА -->
        <div class="island island-left" onclick="alert('Библиотека: Здесь хранятся знания и архивные карточки. В разработке!')">
            <div class="archive-building">
                <!-- Здание Библиотеки (Классическое) -->
                <svg viewBox="0 0 100 100">
                    <path d="M10,80 L90,80 L90,90 L10,90 Z" fill="#4a433a"/>
                    <path d="M15,40 L25,40 L25,80 L15,80 Z" fill="#8b7968"/>
                    <path d="M45,40 L55,40 L55,80 L45,80 Z" fill="#8b7968"/>
                    <path d="M75,40 L85,40 L85,80 L75,80 Z" fill="#8b7968"/>
                    <path d="M5,40 L50,15 L95,40 Z" fill="#dcb254"/>
                    <circle cx="50" cy="30" r="5" fill="#20b2aa"/>
                </svg>
            </div>
            <div class="island-base"></div>
            <div class="island-title">Библиотека</div>
        </div>

        <!-- СПРАВА: ЗАЛ ЦАРСТВА -->
        <div class="island island-right" onclick="alert('Зал Царства: Место встреч и духовного обучения. В разработке!')">
            <div class="hof-building">
                <!-- Здание Зала Царства -->
                <svg viewBox="0 0 100 100">
                    <path d="M10,80 L90,80 L90,90 L10,90 Z" fill="#4a433a"/>
                    <path d="M20,45 L80,45 L80,80 L20,80 Z" fill="#8b7968"/>
                    <path d="M10,45 L50,15 L90,45 Z" fill="#dcb254"/>
                    <rect x="40" y="55" width="20" height="25" fill="#fcebbb"/>
                </svg>
            </div>
            <div class="island-base"></div>
            <div class="island-title">Зал Царства</div>
        </div>

        <!-- СНИЗУ: МПСО -->
        <div class="island island-bottom" onclick="alert('МПСО: Местный проектно-строительный отдел. В разработке!')">
            <div class="mine-building">
                <!-- Иконка МПСО (Стройка/Краны/Блоки) -->
                <svg viewBox="0 0 100 100">
                    <rect x="15" y="70" width="70" height="10" fill="#4a433a"/>
                    <rect x="25" y="40" width="10" height="30" fill="#dcb254"/>
                    <rect x="45" y="50" width="10" height="20" fill="#dcb254"/>
                    <rect x="65" y="30" width="10" height="40" fill="#dcb254"/>
                    <path d="M20,20 L80,20 L80,25 L20,25 Z" fill="#ffdf00"/> 
                    <path d="M30,25 L30,40" stroke="#fff" stroke-width="2"/>
                    <path d="M70,25 L70,30" stroke="#fff" stroke-width="2"/>
                </svg>
            </div>
            <div class="island-base"></div>
            <div class="island-title">МПСО</div>
        </div>
    </div>

    <!-- ВСПЛЫВАЮЩЕЕ ОКНО: ЕЖЕДНЕВНЫЕ НАГРАДЫ -->
    <div class="modal-overlay" id="daily-overlay">
        <div class="daily-modal">
            <div class="close-modal-btn" onclick="closeDailyModal()">×</div>
            <h2 class="daily-title">Пропуск</h2>
            <p class="daily-subtitle">Заходите каждый день и получайте Песчинки!</p>
            
            <div class="days-grid" id="days-grid">
                <!-- Карточки генерируются через JS -->
            </div>

            <button class="claim-btn" id="claim-btn" onclick="claimDailyReward()">Забрать награду</button>
        </div>
    </div>

    <div class="bottom-hint">Выберите локацию для перемещения</div>

  </div> <!-- КОНЕЦ ИГРОВОГО КАДРА -->

    <script>
        // Инициализация данных
        let gameData = JSON.parse(localStorage.getItem('timeGateData')) || {
            sandCount: 150, epochLevel: 1, currentXP: 0, targetXP: 50
        };
        
        // Добавляем параметры для ежедневки, если их нет
        if (typeof gameData.loginStreak === 'undefined') gameData.loginStreak = 0;
        if (typeof gameData.lastClaimDate === 'undefined') gameData.lastClaimDate = null;

        // Награды за 7 дней (потом цикл повторяется)
        const dailyRewards = [10, 15, 20, 25, 30, 50, 100];

        window.onload = () => {
            updateUI();
            checkDailyStatus();

            setTimeout(() => { 
                document.getElementById('clouds').classList.add('open'); 
            }, 200);
        };

        function updateUI() {
            document.getElementById('village-level').innerText = gameData.epochLevel || 1;
            document.getElementById('village-sand').innerText = gameData.sandCount || 0;
        }

        // Проверяем, можно ли сегодня забрать награду
        function checkDailyStatus() {
            let today = new Date().toDateString(); 
            let canClaim = (gameData.lastClaimDate !== today);
            
            if (canClaim) {
                document.getElementById('daily-dot').classList.add('active');
                document.querySelector('.daily-btn').style.animation = 'dailyPulse 1s infinite alternate';
            } else {
                document.getElementById('daily-dot').classList.remove('active');
                document.querySelector('.daily-btn').style.animation = 'none';
            }
        }

        function openDailyModal() {
            renderDaysGrid();
            document.getElementById('daily-overlay').classList.add('show');
        }

        function closeDailyModal() {
            document.getElementById('daily-overlay').classList.remove('show');
        }

        function renderDaysGrid() {
            let grid = document.getElementById('days-grid');
            grid.innerHTML = '';
            
            let today = new Date().toDateString();
            let canClaimToday = (gameData.lastClaimDate !== today);
            
            // Если игрок прошел 7 дней, начинаем заново
            let currentDayIndex = gameData.loginStreak % 7;

            for (let i = 0; i < 7; i++) {
                let card = document.createElement('div');
                card.className = 'day-card';
                
                let title = document.createElement('div');
                title.className = 'day-title';
                title.innerText = `День ${i + 1}`;
                
                let reward = document.createElement('div');
                reward.className = 'day-reward';
                reward.innerHTML = `
                    <svg viewBox="0 0 24 24"><path d="M18 2H6v4.46l4.08 5.54L6 17.54V22h12v-4.46l-4.08-5.54L18 6.46V2zm-2 18H8v-1.46l4-5.43 4 5.43V20zM8 4h8v1.46l-4 5.43-4-5.43V4z"/></svg>
                    ${dailyRewards[i]}
                `;

                // Логика стилей карточки
                if (i < currentDayIndex) {
                    card.classList.add('claimed');
                } else if (i === currentDayIndex) {
                    if (canClaimToday) {
                        card.classList.add('active'); 
                    } else {
                        card.classList.add('claimed'); 
                    }
                }

                card.appendChild(title);
                card.appendChild(reward);
                grid.appendChild(card);
            }

            // Настройка кнопки
            let btn = document.getElementById('claim-btn');
            if (canClaimToday) {
                btn.disabled = false;
                btn.innerText = "Забрать награду";
            } else {
                btn.disabled = true;
                btn.innerText = "Возвращайтесь завтра";
            }
        }

        function claimDailyReward() {
            let today = new Date().toDateString();
            if (gameData.lastClaimDate === today) return; 

            let currentDayIndex = gameData.loginStreak % 7;
            let reward = dailyRewards[currentDayIndex];

            // Начисляем награду
            gameData.sandCount += reward;
            gameData.lastClaimDate = today;
            gameData.loginStreak++;
            
            localStorage.setItem('timeGateData', JSON.stringify(gameData));
            updateUI();
            checkDailyStatus();
            renderDaysGrid(); 

            // Анимация получения
            let btn = document.getElementById('claim-btn');
            btn.innerText = `Получено +${reward} ⏳!`;
            setTimeout(() => {
                closeDailyModal();
            }, 1500);
        }

        function goToLocation(url) {
            document.getElementById('clouds').classList.remove('open');
            setTimeout(() => { 
                window.location.replace(url); 
            }, 1200);
        }
    </script>
</body>
</html>
